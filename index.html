  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="author" content="YS" />
  <meta name="description" content="منجز — مساعد الطالب لإدارة المهام وتنظيم الوقت" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <title>منجز</title>

    *{box-sizing:border-box}
    :root{
      --bg:#f5f7fb; --surface:#fff; --surface2:#eef2f7; --surface3:#e5eaf2;
      --text:#0f172a; --muted:#64748b; --border:#dbe2ea;
      --accent:#2563eb; --ok:#059669; --warn:#d97706; --danger:#dc2626;
      --radius:16px; --shadow:0 10px 28px rgba(15,23,42,.08);
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-t:env(safe-area-inset-top,0px);
    }
    [data-theme="dark"]{
      --bg:#0b1220; --surface:#111827; --surface2:#172033; --surface3:#1f2937;
      --text:#e5e7eb; --muted:#9aa4b2; --border:#334155;
      --shadow:0 14px 36px rgba(0,0,0,.35);
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,"Noto Sans Arabic",sans-serif;
      line-height:1.55; -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:44px;border-radius:12px;padding:10px 14px;font-weight:700;transition:.15s ease}
    button:hover{background:var(--surface2)}
    button:disabled{opacity:.55;cursor:not-allowed}
    input,select,textarea{width:100%;min-height:44px;font-size:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);padding:10px 12px}
    textarea{min-height:110px;resize:vertical}
    :focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px;border-radius:10px}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .small{font-size:.86rem}
    .center{text-align:center}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .between{justify-content:space-between}
    .grid{display:grid;gap:12px}
    .stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
    .cols-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
    .pad0{padding:0;overflow:hidden}
    .title{margin:0 0 4px;font-size:1.05rem;font-weight:800}
    .subtitle{margin:0;color:var(--muted);font-size:.9rem}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{filter:brightness(1.05)}
    .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
    .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
    .btn.ghost{background:transparent}
    .btn.sm{min-height:36px;padding:7px 10px;font-size:.86rem;border-radius:10px}
    .icon-btn{width:44px;height:44px;min-height:44px;padding:0;display:grid;place-items:center;border-radius:12px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);font-size:.86rem;font-weight:700;min-height:38px}
    .chip.active{background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.35);color:var(--accent)}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:.76rem;font-weight:800;background:var(--surface2);border:1px solid var(--border)}
    .badge.high{color:var(--danger)} .badge.medium{color:var(--warn)} .badge.low{color:var(--ok)}
    .badge.new{color:var(--muted)} .badge.inProgress{color:var(--accent)} .badge.done{color:var(--ok)}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}
    .progress{height:9px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-top:8px}
    .progress>span{display:block;height:100%;background:var(--accent);border-radius:99px}
    .kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
    .kv:last-child{border-bottom:0}
    .list{display:flex;flex-direction:column}
    .list-item{display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--border)}
    .list-item:last-child{border-bottom:0}
    .list-item.done{opacity:.62}
    .list-main{flex:1;min-width:0}
    .list-title{font-weight:800;margin:0 0 4px;word-break:break-word}
    .meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.82rem}
    .empty{padding:30px 16px;text-align:center;color:var(--muted)}
    .empty .emoji{font-size:2rem;display:block;margin-bottom:8px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field span{font-size:.88rem;color:var(--muted);font-weight:700}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .form-grid .full{grid-column:1/-1}
    .checkbox-line{display:flex;align-items:center;gap:8px;min-height:44px}
    .checkbox-line input{width:auto;min-height:auto}
    .app-root{min-height:100dvh}
    .login{min-height:100dvh;display:grid;place-items:center;padding:18px}
    .login-card{width:min(100%,460px);display:grid;gap:14px;text-align:center}
    .logo{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;box-shadow:var(--shadow)}
    .google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2937;border-color:#dadce0}
    [data-theme="dark"] .google-btn{background:#111827;color:#e5e7eb;border-color:#334155}
    .shell{display:grid;grid-template-columns:268px 1fr;min-height:100dvh}
    .sidebar{position:fixed;inset-block:0;width:268px;background:var(--surface);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;z-index:60;padding-top:var(--safe-t)}
    [dir="rtl"] .sidebar{right:0;transform:translateX(100%)}
    [dir="ltr"] .sidebar{left:0;transform:translateX(-100%)}
    .sidebar.open{transform:none}
    .brand{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border)}
    .brand-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;display:grid;place-items:center;font-weight:900}
    .nav{padding:10px;overflow:auto;flex:1}
    .nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;margin:3px 0;border:0;background:transparent;color:var(--muted);border-radius:12px;text-align:start}
    .nav-item:hover{background:var(--surface2);color:var(--text)}
    .nav-item.active{background:rgba(37,99,235,.12);color:var(--accent);font-weight:800}
    .sidebar-footer{padding:14px;border-top:1px solid var(--border);color:var(--muted);font-size:.8rem}
    .main{min-width:0;display:flex;flex-direction:column;min-height:100dvh}
    [dir="rtl"] .main{margin-right:268px}
    [dir="ltr"] .main{margin-left:268px}
    .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + var(--safe-t))}
    .top-title{flex:1;min-width:0}
    .top-title h1{margin:0;font-size:1.08rem}
    .top-title p{margin:0;font-size:.8rem}
    .view{padding:16px;max-width:1400px;width:100%;margin:auto}
    .bottom-nav{display:none;position:fixed;inset-inline:0;bottom:0;height:68px;background:var(--surface);border-top:1px solid var(--border);z-index:55;padding-bottom:var(--safe-b)}
    .bottom-nav .nav-item{flex:1;justify-content:center;text-align:center;flex-direction:column;gap:2px;font-size:.72rem;margin:0;border-radius:0}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;z-index:50}
    .overlay.show{opacity:1;pointer-events:auto}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .toolbar .input{flex:1;min-width:220px}
    .kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .kanban-col{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:10px;min-height:220px}
    .kanban-col.dragover{outline:2px dashed var(--accent)}
    .kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;cursor:grab}
    .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .cal-head{font-size:.8rem;color:var(--muted);text-align:center;font-weight:800}
    .day{min-height:92px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;cursor:pointer;position:relative}
    .day.other{opacity:.45}.day.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
    .day.p1{background:rgba(8,145,178,.08)}.day.p2{background:rgba(217,119,6,.10)}.day.p3{background:rgba(220,38,38,.10)}
    .day-num{font-weight:900}.day-events{display:flex;flex-direction:column;gap:4px;margin-top:6px}
    .day-event{font-size:.72rem;background:var(--surface2);border-radius:8px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .timeline{display:flex;flex-direction:column;gap:10px}
    .event{border-inline-start:4px solid var(--accent);background:var(--surface2);border-radius:12px;padding:10px 12px}
    .event.conflict{border-inline-start-color:var(--danger)}
    .timer{display:grid;place-items:center;gap:14px;text-align:center;padding:24px 12px}
    .timer-display{font-size:clamp(3rem,14vw,6rem);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.04em}
    .toast-root{position:fixed;bottom:calc(18px + var(--safe-b));inset-inline-start:18px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:min(92vw,420px)}
    .toast{background:var(--surface);border:1px solid var(--border);border-inline-start:5px solid var(--accent);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;animation:slideIn .2s ease}
    .toast.success{border-inline-start-color:var(--ok)}.toast.error{border-inline-start-color:var(--danger)}.toast.warn{border-inline-start-color:var(--warn)}
    .toast.hide{opacity:0;transform:translateY(8px);transition:.2s}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:14px;z-index:150;opacity:0;transition:.18s}
    .modal-backdrop.show{opacity:1}
    .modal{width:100%;max-width:680px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(8px) scale(.98);transition:.18s}
    .modal-backdrop.show .modal{transform:none}
    .modal.sm{max-width:430px}.modal.lg{max-width:920px}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
    .modal-head h3{margin:0;font-size:1.02rem}
    .modal-body{padding:16px;overflow:auto}
    .modal-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
    .subtask-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .subtask-row input[type="text"]{flex:1}
    .chart{width:100%;height:190px;display:block}
    .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:.84rem}
    .legend-item{display:flex;align-items:center;gap:6px}
    .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden}
    .confetti-piece{position:fixed;width:9px;height:14px;top:-20px;z-index:300;border-radius:3px;animation:fall 1.2s linear forwards}
    @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}
    @media(max-width:1000px){.cols-2{grid-template-columns:1fr}}
    @media(max-width:900px){
      .shell{grid-template-columns:1fr}
      .main{margin:0!important;padding-bottom:calc(76px + var(--safe-b))}
      .bottom-nav{display:flex}
      .top-title p{display:none}
    }
    @media(max-width:760px){
      .form-grid{grid-template-columns:1fr}
      .kanban{grid-template-columns:1fr}
      .day{min-height:76px;padding:6px}
      .day-event{display:none}
      .day .count-pill{display:inline-block;font-size:.7rem;background:var(--surface2);border-radius:99px;padding:2px 6px;margin-top:4px}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>

          notes: String(tsk.notes || ''),

          repeat: REPEATS.includes(tsk.repeat) ? tsk.repeat : 'none',
          repeatInterval: Math.max(1, Math.round(num(tsk.repeatInterval, 7))),
          createdAt: tsk.createdAt || iso(),
          updatedAt: tsk.updatedAt || iso(),
          completedAt: tsk.status==='done' ? (tsk.completedAt || iso()) : null,
          progress: tsk.status==='done' ? 100 : subtasks.length ? Math.round(doneCount/subtasks.length*100) : (tsk.status==='inProgress'?30:0)
        };
      }

      function normalizeSubject(s={}) { return { id:s.id||uid(), name:String(s.name||'').slice(0,120)||'—', color:/^#[0-9a-f]{6}$/i.test(s.color)?s.color:'#2563eb', description:String(s.description||'') }; }
      function normalizeClass(c={}) { return { id:c.id||uid(), title:String(c.title||'').slice(0,160)||'—', subjectId:c.subjectId||null, day:clamp(Math.round(num(c.day,0)),0,6), start:String(c.start||'08:00'), end:String(c.end||'09:00'), room:String(c.room||''), teacher:String(c.teacher||'') }; }
      function normalizeExam(e={}) { return { id:e.id||uid(), title:String(e.title||'').slice(0,160)||'—', subjectId:e.subjectId||null, date:e.date||toLocalInput(addDays(new Date(),1)), type:e.type==='delivery'?'delivery':'exam', topics:String(e.topics||''), plan:String(e.plan||''), readiness:clamp(Math.round(num(e.readiness,0)),0,100), notes:String(e.notes||'') }; }
      function normalizeSession(s={}) { return { id:s.id||uid(), taskId:s.taskId||null, subjectId:s.subjectId||null, mode:s.mode==='break'?'break':'focus', startedAt:s.startedAt||iso(), endedAt:s.endedAt||iso(), plannedSec:Math.max(0,Math.round(num(s.plannedSec,0))), actualSec:Math.max(0,Math.round(num(s.actualSec,0))), status:s.status==='cancelled'?'cancelled':'completed' }; }
      function normalizeHabit(h={}) { return { id:h.id||uid(), title:String(h.title||'').slice(0,120)||'—', logs:Array.isArray(h.logs)?h.logs.map(String):[] }; }
      function normalizeCourse(c={}) { return { id:c.id||uid(), name:String(c.name||'').slice(0,120)||'—', credits:Math.max(0,num(c.credits,3)), grade:Object.keys(GRADES).includes(c.grade)?c.grade:'A' }; }
      function normalizeNote(n={}) { return { id:n.id||uid(), title:String(n.title||'').slice(0,160)||'—', content:String(n.content||''), subjectId:n.subjectId||null, keywords:String(n.keywords||''), updatedAt:n.updatedAt||iso() }; }
      function normalizeActive(a){ if(!a) return null; return { sessionId:a.sessionId||uid(), taskId:a.taskId||null, subjectId:a.subjectId||null, mode:a.mode==='break'?'break':'focus', plannedSec:Math.max(1,Math.round(num(a.plannedSec,1500))), startedAt:Number(a.startedAt||Date.now()), pausedAt:a.pausedAt?Number(a.pausedAt):null, accumulatedMs:Math.max(0,Number(a.accumulatedMs||0)), cycle:Number(a.cycle||0) }; }

      function normalizeState(input){
        const s = input && typeof input==='object' ? input : {};
        const out = JSON.parse(JSON.stringify(DEFAULT_STATE));
        Object.assign(out, s);
        out.schemaVersion = SCHEMA_VERSION;
        out.meta = { ...DEFAULT_STATE.meta, ...(s.meta||{}) };
        out.auth = { ...DEFAULT_STATE.auth, ...(s.auth||{}) };
        out.profile = { ...DEFAULT_STATE.profile, ...(s.profile||{}) };
        out.settings = { ...DEFAULT_STATE.settings, ...(s.settings||{}) };
        out.settings.pomodoro = { ...DEFAULT_STATE.settings.pomodoro, ...(s.settings?.pomodoro||{}) };
        out.game = { ...DEFAULT_STATE.game, ...(s.game||{}) };
        out.notifications = { seen:{}, ...(s.notifications||{}) };
        out.gpaTarget = num(s.gpaTarget, 3);
        ['subjects','tasks','classes','exams','sessions','habits','courses','notes'].forEach(k => out[k] = Array.isArray(s[k]) ? s[k] : []);
        out.subjects = out.subjects.map(normalizeSubject);
        out.tasks = out.tasks.map(normalizeTask);
        out.classes = out.classes.map(normalizeClass);
        out.exams = out.exams.map(normalizeExam);
        out.sessions = out.sessions.map(normalizeSession);
        out.habits = out.habits.map(normalizeHabit);
        out.courses = out.courses.map(normalizeCourse);
        out.notes = out.notes.map(normalizeNote);
        out.activeFocus = normalizeActive(s.activeFocus);
        out.ui = { ...DEFAULT_STATE.ui, ...(s.ui||{}), sidebarOpen:false, planDraft:null };
        return out;
      }

      function saveState(sync=true){
        state.updatedAt = Date.now();
        window.__state = state;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        catch(e){ console.error(e); toast(t('storageError'),'error'); }
        if(sync) scheduleSync();
      }

      /* =========================
         4) Firebase / Auth / Sync
         ========================= */
      const fb = { ready:false, app:null, auth:null, db:null, error:null };
      let syncTimer = null;

      const OWNER_EMAIL = 'yassinmohmmed555@gmail.com';
      const isOwner = () => !!state.auth.email && state.auth.email.toLowerCase() === OWNER_EMAIL;

      function hasFirebaseConfig(){ return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId); }

      function loadScript(src){
        return new Promise((resolve,reject)=>{
          const s=document.createElement('script'); s.src=src; s.async=true;
          s.onload=resolve; s.onerror=()=>reject(new Error('Failed '+src));
          document.head.appendChild(s);
        });
      }

      async function initFirebase(){
        if(!hasFirebaseConfig()) return false;
        try {
          if(!window.firebase) {
            await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
            await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
            await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
          }
          fb.app = firebase.initializeApp(FIREBASE_CONFIG, 'munjiz');
          fb.auth = fb.app.auth();
          fb.db = fb.app.firestore();
          try { await fb.db.enablePersistence({ synchronizeTabs:true }); } catch(e) { console.warn('offline persistence', e); }
          fb.ready = true;
          return true;
        } catch(e) { fb.error=e; console.warn(e); return false; }
      }

      function authErrorMessage(code){
        const map = {
          'auth/popup-closed-by-user':'popupClosed',
          'auth/cancelled-popup-request':'popupClosed',
          'auth/network-request-failed':'networkError',
          'auth/unauthorized-domain':'unauthorizedDomain',
          'auth/operation-not-allowed':'operationNotAllowed',
          'auth/account-exists-with-different-credential':'accountExists'
        };
        return t(map[code] || 'unknownError');
      }

      async function signInWithGoogle(remember=true){
        if(!fb.ready){ toast(t('firebaseMissing'),'warn'); return; }
        try {
          await fb.auth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
          const provider = new firebase.auth.GoogleAuthProvider();
          await fb.auth.signInWithPopup(provider);
        } catch(e){
          console.error(e);
          if(e.code==='auth/popup-blocked' || e.code==='auth/operation-not-supported-in-this-environment'){
            try { await fb.auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); return; } catch(e2){ console.error(e2); }
          }
          toast(authErrorMessage(e.code), 'error');
        }
      }

      async function signOutUser(){
        if(fb.ready && fb.auth.currentUser) await fb.auth.signOut().catch(()=>{});
        setGuestActive(false);
        state.auth = { ...DEFAULT_STATE.auth };
        saveState(false);
        render();
      }

      function watchAuth(){
        if(!fb.ready) return;
        fb.auth.onAuthStateChanged(async user => {
          if(user){
            state.auth = { provider:'firebase', uid:user.uid, displayName:user.displayName||'', photoURL:user.photoURL||'', email:user.email||'' };
            state.profile.name = state.profile.name || user.displayName || '';
            setGuestActive(false);
            saveState(false);
            await pullCloud();
            reportProfile(); showOwnerVip();
            render();
          } else {
            if(state.auth.provider==='firebase') state.auth = { ...DEFAULT_STATE.auth };
            render();
          }
        });
      }

      function scheduleSync(){
        if(!fb.ready || state.auth.provider!=='firebase') return;
        clearTimeout(syncTimer);
        syncTimer = setTimeout(pushCloud, 1200);
      }

      async function pushCloud(){
        if(!fb.ready || state.auth.provider!=='firebase') return;
        try {
          const clean = JSON.parse(JSON.stringify(state));
          await fb.db.collection('munjiz_users').doc(state.auth.uid).collection('data').doc('main').set({ state:clean, updatedAt:state.updatedAt }, { merge:true });
        } catch(e){ console.warn(e); }
      }

      async function pullCloud(){
        if(!fb.ready || state.auth.provider!=='firebase') return;
        try {
          const snap = await fb.db.collection('munjiz_users').doc(state.auth.uid).collection('data').doc('main').get();
          if(snap.exists){
            const data = snap.data();
            const cloudState = normalizeState(data.state || {});
            if((data.updatedAt || 0) > state.updatedAt){
              state = cloudState;
              window.__state = state;
              saveState(false);
              applySettings();
            } else {
              await pushCloud();
            }
          } else {
            await pushCloud();
          }
        } catch(e){ console.warn(e); toast(t('syncError'),'warn'); }
      }

      function setGuestActive(v, remember=true){
        if(v){ (remember?localStorage:sessionStorage).setItem('munjiz.guest','1'); }
        else { localStorage.removeItem('munjiz.guest'); sessionStorage.removeItem('munjiz.guest'); }
      }
      function getGuestActive(){ return localStorage.getItem('munjiz.guest')==='1' || sessionStorage.getItem('munjiz.guest')==='1'; }
      function isLoggedIn(){ return state.auth.provider==='firebase' || getGuestActive(); }

      /* =========================
         5) الخدمات
         ========================= */
      const Tasks = {
        create(data){ const task=normalizeTask(data); state.tasks.unshift(task); saveState(); checkBadges(); return task; },
        update(id, patch){ const tsk=taskById(id); if(!tsk) return; Object.assign(tsk, patch); const norm=normalizeTask(tsk); Object.assign(tsk, norm); saveState(); },
        remove(id){ const idx=state.tasks.findIndex(x=>x.id===id); if(idx<0) return; const item=state.tasks[idx]; state.tasks.splice(idx,1); saveState(); setUndo(()=>{ state.tasks.splice(idx,0,item); saveState(); render(); }, t('deleted')); toast(t('deleted'),'info',{label:t('undo'), action:'undo-last'}); },
        setStatus(id,status){ const tsk=taskById(id); if(!tsk) return; if(status==='done') Tasks.complete(id); else { tsk.status=status; tsk.completedAt=null; tsk.updatedAt=iso(); saveState(); render(); } },
        complete(id){
          const tsk=taskById(id); if(!tsk || tsk.status==='done') return;
          tsk.status='done'; tsk.completedAt=iso(); tsk.subtasks.forEach(s=>s.done=true); tsk.progress=100; tsk.updatedAt=iso();
          addPoints(10); markStudyDay(); celebrate();
          if(tsk.repeat!=='none' && tsk.dueAt){
            const days = tsk.repeat==='daily'?1:tsk.repeat==='weekly'?7:tsk.repeatInterval;
            const next = normalizeTask({ ...tsk, id:uid(), status:'new', completedAt:null, createdAt:iso(), updatedAt:iso(), dueAt:new Date(parseDate(tsk.dueAt).getTime()+days*DAY_MS).toISOString(), subtasks:tsk.subtasks.map(s=>({id:uid(),title:s.title,done:false})), progress:0, actualMin:0 });
            state.tasks.unshift(next);
            toast(t('recurringCreated'),'info');
          }
          saveState(); checkBadges(); render(); toast(t('taskCompleted'),'success');
        },
        toggle(id){ const tsk=taskById(id); if(!tsk) return; if(tsk.status==='done') Tasks.update(id,{status:'new',completedAt:null}); else Tasks.complete(id); }
      };

      const Subjects = {
        upsert(data){ const s=normalizeSubject(data); const i=state.subjects.findIndex(x=>x.id===s.id); if(i>=0) state.subjects[i]=s; else state.subjects.push(s); saveState(); return s; },
        remove(id){ const linked=state.tasks.filter(x=>x.subjectId===id).length; if(linked){ confirmModal({title:t('delete'),message:t('deleteSubjectWarn'),confirmText:t('unlink')}).then(ok=>{ if(!ok) return; state.tasks.forEach(x=>{if(x.subjectId===id)x.subjectId=null;}); state.exams.forEach(x=>{if(x.subjectId===id)x.subjectId=null;}); state.classes.forEach(x=>{if(x.subjectId===id)x.subjectId=null;}); state.notes.forEach(x=>{if(x.subjectId===id)x.subjectId=null;}); state.subjects=state.subjects.filter(x=>x.id!==id); saveState(); render(); toast(t('deleted'),'success'); }); } else { state.subjects=state.subjects.filter(x=>x.id!==id); saveState(); render(); toast(t('deleted'),'success'); } }
      };

      const Exams = {
        upsert(data){ const e=normalizeExam(data); const i=state.exams.findIndex(x=>x.id===e.id); if(i>=0) state.exams[i]=e; else state.exams.unshift(e); saveState(); return e; },
        remove(id){ const idx=state.exams.findIndex(x=>x.id===id); if(idx<0)return; const item=state.exams[idx]; state.exams.splice(idx,1); saveState(); setUndo(()=>{state.exams.splice(idx,0,item);saveState();render();},t('deleted')); toast(t('deleted'),'info',{label:t('undo'),action:'undo-last'}); }
      };

      const Classes = {
        upsert(data){ const c=normalizeClass(data); const i=state.classes.findIndex(x=>x.id===c.id); if(i>=0) state.classes[i]=c; else state.classes.push(c); saveState(); return c; },
        remove(id){ state.classes=state.classes.filter(x=>x.id!==id); saveState(); toast(t('deleted'),'success'); }
      };

      const Notes = {
        upsert(data){ const n=normalizeNote(data); const i=state.notes.findIndex(x=>x.id===n.id); if(i>=0) state.notes[i]=n; else state.notes.unshift(n); saveState(); return n; },
        remove(id){ state.notes=state.notes.filter(x=>x.id!==id); saveState(); toast(t('deleted'),'success'); }
      };

      const Habits = {
        upsert(data){ const h=normalizeHabit(data); const i=state.habits.findIndex(x=>x.id===h.id); if(i>=0) state.habits[i]=h; else state.habits.push(h); saveState(); return h; },
        toggle(id,date=dateKey(new Date())){ const h=state.habits.find(x=>x.id===id); if(!h)return; if(h.logs.includes(date)) h.logs=h.logs.filter(d=>d!==date); else h.logs.push(date); saveState(); render(); },
        remove(id){ state.habits=state.habits.filter(x=>x.id!==id); saveState(); }
      };

      const Courses = {
        upsert(data){ const c=normalizeCourse(data); const i=state.courses.findIndex(x=>x.id===c.id); if(i>=0) state.courses[i]=c; else state.courses.push(c); saveState(); return c; },
        remove(id){ state.courses=state.courses.filter(x=>x.id!==id); saveState(); }
      };

      function addPoints(n){
        const before = levelFromPoints(state.game.points);
        state.game.points = Math.max(0, state.game.points + n);
        const after = levelFromPoints(state.game.points);
        if(after > before) toast(`${t('levelUp')}: ${after}`, 'success');
      }
      function levelFromPoints(p){ return Math.floor(Math.sqrt(Math.max(0,p)/25)) + 1; }
      function levelProgress(p){ const lvl=levelFromPoints(p); const cur=(lvl-1)**2*25; const next=lvl**2*25; return clamp(Math.round((p-cur)/(next-cur)*100),0,100); }
      function markStudyDay(){
        const today=dateKey(new Date());
        if(state.game.lastStudyDate===today) return;
        const yesterday=dateKey(addDays(new Date(),-1));
        state.game.streak = state.game.lastStudyDate===yesterday ? state.game.streak+1 : 1;
        state.game.lastStudyDate = today;
      }

      const BADGES = [
        { id:'first_task', title:'firstTask', check:()=>state.tasks.some(t=>t.status==='done') },
        { id:'five_sessions', title:'fiveSessions', check:()=>completedSessions().length>=5 },
        { id:'week_streak', title:'weekStreak', check:()=>state.game.streak>=7 },
        { id:'hundred_points', title:'hundredPoints', check:()=>state.game.points>=100 }
      ];
      function checkBadges(){
        BADGES.forEach(b=>{
          if(!state.game.badges[b.id] && b.check()){
            state.game.badges[b.id] = { unlockedAt: iso() };
            addPoints(25);
            toast(`${t('badgeUnlocked')}: ${t(b.title)}`, 'success');
          }
        });
        saveState(false);
      }

      /* =========================
         6) التركيز
         ========================= */
      let timerInterval = null;
      function ensureTimer(){ if(!timerInterval) timerInterval = setInterval(tickTimer, 1000); }
      function activeElapsedMs(){ const a=state.activeFocus; if(!a) return 0; return a.accumulatedMs + (a.pausedAt ? 0 : Date.now()-a.startedAt); }
      function activeRemainingSec(){ const a=state.activeFocus; if(!a) return 0; return Math.max(0, Math.ceil((a.plannedSec*1000 - activeElapsedMs())/1000)); }

      function startFocus({taskId=null, subjectId=null, minutes=25, mode='focus'}={}){
        if(state.activeFocus){ toast(t('currentSession'),'warn'); return; }
        const task = taskId ? taskById(taskId) : null;
        state.activeFocus = normalizeActive({
          sessionId: uid(), taskId, subjectId: subjectId || task?.subjectId || null, mode,
          plannedSec: Math.max(1, Math.round(minutes*60)), startedAt: Date.now(), pausedAt:null, accumulatedMs:0,
          cycle: completedSessions().filter(s=>sameDay(new Date(s.startedAt), new Date())).length + 1
        });
        if(task && task.status==='new') Tasks.update(task.id,{status:'inProgress'});
        saveState(); ensureTimer(); render(); toast(mode==='focus'?t('start'):t('shortBreak'),'success');
      }
      function pauseFocus(){ const a=state.activeFocus; if(!a||a.pausedAt)return; a.accumulatedMs += Date.now()-a.startedAt; a.pausedAt=Date.now(); saveState(); updateFocusUI(); toast(t('pause'),'info'); }
      function resumeFocus(){ const a=state.activeFocus; if(!a||!a.pausedAt)return; a.startedAt=Date.now(); a.pausedAt=null; saveState(); updateFocusUI(); toast(t('resume'),'info'); }
      function stopFocus(cancel=true){
        const a=state.activeFocus; if(!a)return;
        const elapsedSec = Math.floor(activeElapsedMs()/1000);
        if(cancel && elapsedSec>10) logSession(a, 'cancelled', elapsedSec);
        state.activeFocus=null; saveState(); render(); toast(cancel?t('cancelled'):t('reset'), cancel?'warn':'info');
      }
      function finishFocusEarly(){
        const a=state.activeFocus; if(!a)return;
        const elapsedSec = Math.floor(activeElapsedMs()/1000);
        logSession(a, 'completed', elapsedSec);
        state.activeFocus=null; saveState(); render(); toast(t('sessionLogged'),'success');
      }
      function logSession(a, status, actualSecOverride=null){
        const actualSec = actualSecOverride!=null ? Math.max(0, Math.round(actualSecOverride)) : (status==='completed' ? Math.min(a.plannedSec, Math.max(1, Math.floor(activeElapsedMs()/1000))) : Math.floor(activeElapsedMs()/1000));
        const session = normalizeSession({ id:a.sessionId, taskId:a.taskId, subjectId:a.subjectId, mode:a.mode, startedAt:new Date(a.startedAt - a.accumulatedMs).toISOString(), endedAt:iso(), plannedSec:a.plannedSec, actualSec, status });
        state.sessions.unshift(session);
        if(status==='completed' && a.mode==='focus'){
          if(a.taskId){ const tsk=taskById(a.taskId); if(tsk){ tsk.actualMin += Math.round(actualSec/60); tsk.updatedAt=iso(); } }
          addPoints(Math.max(1, Math.round(actualSec/60)));
          markStudyDay();
          playSound(); vibrate();
          notifyBrowser(t('focusTimer'), `${t('sessionLogged')} • ${fmtDuration(actualSec/60)}`);
        }
        saveState(); checkBadges();
      }
      function tickTimer(){
        const a=state.activeFocus;
        if(!a){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} return; }
        updateFocusUI();
        if(!a.pausedAt && activeRemainingSec()<=0){
          logSession(a,'completed',a.plannedSec);
          state.activeFocus=null; saveState(); render(); toast(t('sessionLogged'),'success');
        }
      }
      function updateFocusUI(){
        const a=state.activeFocus; if(!a) return;
        const rem=activeRemainingSec(); const txt=`${pad(Math.floor(rem/60))}:${pad(rem%60)}`;
        $$('[data-remaining]').forEach(n=>n.textContent=txt);
        $$('[data-focus-progress]').forEach(n=>n.style.width = clamp(100-(rem/a.plannedSec*100),0,100)+'%');
        $$('[data-focus-state]').forEach(n=>n.textContent = a.pausedAt ? t('pause') : t('start'));
        const pauseBtn=$('[data-action="focus-pause"]'), resumeBtn=$('[data-action="focus-resume"]');
        if(pauseBtn) pauseBtn.classList.toggle('hidden', !!a.pausedAt);
        if(resumeBtn) resumeBtn.classList.toggle('hidden', !a.pausedAt);
      }
      function recoverFocus(){
        const a=state.activeFocus; if(!a) return;
        if(!a.pausedAt && activeElapsedMs() > a.plannedSec*1000 + 5*60000){
          openModal({ title:t('currentSession'), size:'sm', dismissible:false, body:`<p>${t('notEnoughTime')}</p>`, footer:`<button class="btn primary" data-action="focus-recover-complete">${t('completed')}</button><button class="btn danger" data-action="focus-recover-cancel">${t('cancelled')}</button>` });
        } else ensureTimer();
      }
      function playSound(){ if(!state.settings.sound)return; try{ const Ctx=window.AudioContext||window.webkitAudioContext; const ctx=new Ctx(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.value=.08; o.start(); setTimeout(()=>{o.stop();ctx.close();},180); }catch{} }
      function vibrate(){ if(state.settings.vibration && navigator.vibrate) navigator.vibrate([80,40,80]); }
      function celebrate(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; const colors=['#2563eb','#7c3aed','#059669','#d97706','#dc2626']; for(let i=0;i<28;i++){ const el=document.createElement('div'); el.className='confetti-piece'; el.style.left=Math.random()*100+'vw'; el.style.background=colors[i%colors.length]; el.style.animationDelay=(Math.random()*.25)+'s'; document.body.appendChild(el); setTimeout(()=>el.remove(),1500); } }

      /* =========================
         7) التنبيهات
         ========================= */
      function getAlerts(){
        const now=Date.now(); const lead=state.settings.notifyLead*60000; const alerts=[];
        state.tasks.filter(t=>t.status!=='done' && t.dueAt).forEach(t=>{ const due=Date.parse(t.dueAt); if(due-now<=lead && due-now>-lead*2) alerts.push({type:'task', id:t.id, title:t.title, due:t.dueAt, overdue:due<now}); });
        state.exams.forEach(e=>{ const due=Date.parse(e.date); if(due-now<=lead && due-now>-lead*2) alerts.push({type:'exam', id:e.id, title:e.title, due:e.date, overdue:due<now}); });
        return alerts.sort((a,b)=>Date.parse(a.due)-Date.parse(b.due));
      }
      function alertKey(a){ return `${a.type}-${a.id}-${a.due}`; }
      function unreadAlerts(){ return getAlerts().filter(a=>!state.notifications.seen[alertKey(a)]); }
      function checkNotifications(){
        const alerts=unreadAlerts();
        if(Notification?.permission==='granted'){
          alerts.slice(0,3).forEach(a=>{
            try { new Notification(a.overdue ? t('overdue') : t('notifications'), { body:a.title }); } catch(e){}
            state.notifications.seen[alertKey(a)] = true;
          });
          saveState(false);
        }
        updateBell();
      }
      function notifyBrowser(title,body){ if(Notification?.permission==='granted'){ try{ new Notification(title,{body}); }catch{} } }
      function requestNotificationPermission(){
        if(!('Notification' in window)){ toast(t('notificationExplanation'),'warn'); return; }
        Notification.requestPermission().then(p=>{ toast(p==='granted'?t('saved'):t('notificationExplanation'), p==='granted'?'success':'warn'); render(); });
      }
      function updateBell(){
        const badge=$('#bellCount'); if(!badge)return;
        const count=unreadAlerts().length;
        badge.textContent=count>99?'99+':count;
        badge.classList.toggle('hidden', count===0);
      }
      function maybeMorningSummary(){
        const today=dateKey(new Date());
        if(state.meta.lastMorning===today) return;
        const todays = state.tasks.filter(t=>t.status!=='done' && t.dueAt && sameDay(parseDate(t.dueAt), new Date()));
        if(todays.length){
          state.meta.lastMorning=today; saveState(false);
          openModal({ title:t('morningSummary'), size:'sm', body:`<p>${t('morningText')}</p><div class="list">${todays.slice(0,5).map(taskRowHtml).join('')}</div>`, footer:`<button class="btn primary" data-close>${t('open')}</button>` });
        }
      }

      /* =========================
         8) التخطيط الذكي
         ========================= */
      function generatePlan(){
        const now=new Date(); const end=endOfDay(now);
        const avail=state.settings.availableMinutes;
        const candidates=state.tasks.filter(t=>t.status!=='done' && (isOverdue(t) || (t.dueAt && parseDate(t.dueAt)<=end) || t.priority==='high'))
          .sort((a,b)=>{
            const ao=isOverdue(a)?0:1, bo=isOverdue(b)?0:1; if(ao!==bo)return ao-bo;
            const ad=parseDate(a.dueAt)?.getTime()||Infinity, bd=parseDate(b.dueAt)?.getTime()||Infinity; if(ad!==bd)return ad-bd;
            const pw={high:3,medium:2,low:1}; return pw[b.priority]-pw[a.priority];
          });
        let remaining=avail; const plan=[]; const skipped=[];
        for(const tsk of candidates){
          const need=Math.max(15, tsk.estimate||25);
          if(need<=remaining){ plan.push({taskId:tsk.id, minutes:need}); remaining-=need; if(remaining>state.settings.breakMinutes) remaining-=state.settings.breakMinutes; }
          else skipped.push(tsk);
        }
        return { plan, skipped, remaining };
      }
      function openPlannerModal(){
        const draft=generatePlan(); state.ui.planDraft=draft;
        const body = `
          <p class="muted">${t('suggestedPlan')}</p>
          ${draft.plan.length ? `<div class="list">${draft.plan.map((p,i)=>{ const tsk=taskById(p.taskId); return `<div class="list-item"><div class="list-main"><div class="list-title">${i+1}. ${esc(tsk?.title||'—')}</div><div class="meta"><span>${fmtDuration(p.minutes)}</span>${tsk?.dueAt?`<span>${esc(relativeDue(tsk.dueAt))}</span>`:''}</div></div><button class="icon-btn" data-action="plan-remove" data-index="${i}">${icon('close',16)}</button></div>`; }).join('')}</div>` : `<div class="empty">${esc(t('noTasks'))}</div>`}
          ${draft.skipped.length ? `<div class="card" style="margin-top:10px;border-color:rgba(220,38,38,.35)"><strong>${t('insufficientTime')}</strong><div class="muted small">${draft.skipped.map(s=>esc(s.title)).join('، ')}</div></div>` : ''}
        `;
        openModal({ title:t('planner'), body, size:'lg', footer:`<button class="btn primary" data-action="plan-accept">${t('acceptPlan')}</button><button class="btn" data-action="plan-reject">${t('rejectPlan')}</button>` });
      }

      /* =========================
         9) UI عام
         ========================= */
      let modalStack=[];
      let undoFn=null;

      function toast(msg, type='info', action=null){
        const root=$('#toastRoot'); const el=document.createElement('div'); el.className=`toast ${type}`;
        el.innerHTML = `<div style="flex:1">${esc(msg)}</div>`;
        if(action){ const btn=document.createElement('button'); btn.className='btn sm'; btn.textContent=action.label; btn.dataset.action=action.action; el.appendChild(btn); }
        root.appendChild(el);
        setTimeout(()=>{ el.classList.add('hide'); setTimeout(()=>el.remove(),220); }, action?6000:3200);
      }
      function setUndo(fn,label){ undoFn={fn,label}; }

      function openModal(opts){
        const id=uid(); const backdrop=document.createElement('div'); backdrop.className='modal-backdrop';
        const modal=document.createElement('div'); modal.className=`modal ${opts.size||''}`; modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true');
        modal.innerHTML = `
          <div class="modal-head"><h3>${esc(opts.title||'')}</h3><button class="icon-btn" data-close aria-label="${esc(t('close'))}">${icon('close',18)}</button></div>
          <div class="modal-body">${opts.body||''}</div>
          ${opts.footer?`<div class="modal-foot">${opts.footer}</div>`:''}
        `;
        backdrop.appendChild(modal); $('#modalRoot').appendChild(backdrop);
        requestAnimationFrame(()=>backdrop.classList.add('show'));
        const api={ id, el:modal, backdrop, close(){ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(),180); modalStack=modalStack.filter(m=>m.id!==id); } };
        backdrop.addEventListener('mousedown', e=>{ if(e.target===backdrop && opts.dismissible!==false) api.close(); });
        modal.querySelector('[data-close]').addEventListener('click', api.close);
        modalStack.push(api);
        if(opts.onMount) opts.onMount(api);
        setTimeout(()=>modal.querySelector('input,select,textarea,button')?.focus(),60);
        return api;
      }
      function confirmModal({title='',message='',confirmText='',cancelText='',danger=false}={}){
        return new Promise(resolve=>{
          const m=openModal({ title, size:'sm', body:`<p>${esc(message)}</p>`, footer:`<button class="btn ${danger?'danger':'primary'}" id="ok">${esc(confirmText||t('confirm'))}</button><button class="btn" id="cx">${esc(cancelText||t('cancel'))}</button>`, dismissible:false });
          m.el.querySelector('#ok').onclick=()=>{m.close();resolve(true);};
          m.el.querySelector('#cx').onclick=()=>{m.close();resolve(false);};
        });
      }
      function dangerConfirm({title='',message='',keyword='' }={}){
        return new Promise(resolve=>{
          const m=openModal({ title, size:'sm', dismissible:false, body:`<p>${esc(message)}</p><label class="field"><span>${esc(keyword)}</span><input class="input" id="kw"></label>`, footer:`<button class="btn danger" id="ok">${esc(t('confirm'))}</button><button class="btn" id="cx">${esc(t('cancel'))}</button>` });
          m.el.querySelector('#ok').onclick=()=>{ if(m.el.querySelector('#kw').value.trim().toLowerCase()===keyword.toLowerCase()){ m.close(); resolve(true);} else toast(t('invalidDate'),'error'); };
          m.el.querySelector('#cx').onclick=()=>{m.close();resolve(false);};
        });
      }

      function filteredTasks(){
        const q=state.ui.taskSearch.trim().toLowerCase(); const now=new Date(); const f=state.ui.taskFilter;
        let list=state.tasks.filter(tsk=>{
          if(q && !`${tsk.title} ${tsk.description} ${tsk.notes} ${tsk.tags.join(' ')}`.toLowerCase().includes(q)) return false;
          if(f==='today') return tsk.status!=='done' && tsk.dueAt && sameDay(parseDate(tsk.dueAt), now);
          if(f==='upcoming') return tsk.status!=='done' && tsk.dueAt && parseDate(tsk.dueAt)>=now;
          if(f==='overdue') return isOverdue(tsk);
          if(f==='done') return tsk.status==='done';
          return true;
        });
        const pw={high:3,medium:2,low:1};
        list.sort((a,b)=>{
          if(state.ui.taskSort==='due'){ const ad=parseDate(a.dueAt)?.getTime()||Infinity, bd=parseDate(b.dueAt)?.getTime()||Infinity; return ad-bd; }
          if(state.ui.taskSort==='priority') return pw[b.priority]-pw[a.priority];
          if(state.ui.taskSort==='created') return new Date(b.createdAt)-new Date(a.createdAt);
          return a.title.localeCompare(b.title);
        });
        return list;
      }

        return `
        <div class="card">
          <div class="row between"><h2 class="title">${esc(t('scheduleWeekly'))}</h2><button class="btn primary" data-action="new-class">${icon('plus',18)} ${esc(t('addClass'))}</button></div>
          <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:10px">
            ${days.map(d=>{
              const items=state.classes.filter(c=>c.day===d).sort((a,b)=>a.start.localeCompare(b.start));
              const total=items.reduce((s,c)=>s+minutesBetween(`1970-01-01T${c.start}`, `1970-01-01T${c.end}`),0);
              return `<div class="card"><div class="row between"><strong>${esc(dayName(d))}</strong><span class="muted small">${esc(fmtDuration(total))}</span></div>
                ${items.length?items.map(c=>`<div class="event ${conflicts.has(c.id)?'conflict':''}" style="margin-top:8px"><strong>${esc(c.title)}</strong><div class="muted small">${esc(c.start)} - ${esc(c.end)} • ${esc(c.room||'—')} • ${esc(c.teacher||'—')}</div>${conflicts.has(c.id)?`<div class="small" style="color:var(--danger);font-weight:800">${esc(t('conflictDetected'))}</div>`:''}<div class="row" style="margin-top:6px"><button class="btn sm" data-action="edit-class" data-id="${c.id}">${esc(t('edit'))}</button><button class="btn sm danger" data-action="delete-class" data-id="${c.id}">${esc(t('delete'))}</button></div></div>`).join(''):emptyHtml(t('noClasses'))}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }
      function dayName(d){ const names=state.settings.lang==='ar'?['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; return names[d]; }
      function classConflictIds(){
        const ids=new Set(); const byDay={};
        state.classes.forEach(c=>{ (byDay[c.day] ||= []).push(c); });
        Object.values(byDay).forEach(arr=>{ arr.sort((a,b)=>a.start.localeCompare(b.start)); for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){ if(arr[j].start < arr[i].end){ ids.add(arr[i].id); ids.add(arr[j].id); } } });
        return ids;
      }

      function renderCalendar(){
        const anchor = state.ui.calendarAnchor ? parseDate(state.ui.calendarAnchor) : new Date();
        state.ui.calendarAnchor = anchor.toISOString();
        const mode = state.ui.calendarMode || 'month';
        return `
        <div class="card">
          <div class="toolbar">
            <button class="btn sm" data-action="cal-prev">${icon('arrowRight',16)}</button>
            <button class="btn sm" data-action="cal-today">${esc(t('current'))}</button>
            <button class="btn sm" data-action="cal-next">${icon('arrowLeft',16)}</button>
            <strong>${esc(mode==='month'?anchor.toLocaleDateString(state.settings.lang==='ar'?'ar':'en',{month:'long',year:'numeric'}):t('weekView'))}</strong>
            <div class="row" style="margin-inline-start:auto">
              <button class="chip ${mode==='month'?'active':''}" data-action="cal-mode" data-mode="month">${esc(t('monthView'))}</button>
              <button class="chip ${mode==='week'?'active':''}" data-action="cal-mode" data-mode="week">${esc(t('weekView'))}</button>
              <button class="btn primary sm" data-action="new-task" data-date="${toDateInput(anchor)}">${esc(t('addTask'))}</button>
            </div>
          </div>
          ${mode==='month'?renderMonth(anchor):renderWeek(anchor)}
        </div>`;
      }
      function renderMonth(anchor){
        const first=new Date(anchor.getFullYear(), anchor.getMonth(), 1);
        const start=weekStartDate(first);
        const days=Array.from({length:42},(_,i)=>addDays(start,i));
        const heads=[0,1,2,3,4,5,6].map(i=>dayName((state.settings.weekStart+i)%7));
        return `<div class="calendar">${heads.map(h=>`<div class="cal-head">${esc(h)}</div>`).join('')}${days.map(d=>{
          const evs=dayEvents(d); const pressure=evs.reduce((s,e)=>s+(e.minutes||30),0);
          const cls=pressure>240?'p3':pressure>120?'p2':pressure>0?'p1':'';
          return `<div class="day ${sameDay(d,new Date())?'today':''} ${d.getMonth()!==anchor.getMonth()?'other':''} ${cls}" data-action="cal-day" data-date="${toDateInput(d)}">
            <div class="day-num">${d.getDate()}</div>${evs.length?`<span class="count-pill">${evs.length}</span>`:''}
            <div class="day-events">${evs.slice(0,3).map(e=>`<div class="day-event" style="border-inline-start:3px solid ${esc(e.color||'var(--accent)')}">${esc(e.title)}</div>`).join('')}</div>
          </div>`;
        }).join('')}</div>`;
      }
      function renderWeek(anchor){
        const start=weekStartDate(anchor); const days=Array.from({length:7},(_,i)=>addDays(start,i));
        return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${days.map(d=>{
          const evs=dayEvents(d);
          return `<div class="card"><strong>${esc(dayName(d.getDay()))} ${d.getDate()}</strong>${evs.length?`<div class="timeline" style="margin-top:8px">${evs.map(e=>`<div class="event" style="border-inline-start-color:${esc(e.color||'var(--accent)')}"><strong>${esc(e.title)}</strong><div class="muted small">${esc(e.time||'')}</div></div>`).join('')}</div>`:emptyHtml(t('noTasks'))}</div>`;
        }).join('')}</div>`;
      }
      function dayEvents(d){
        const key=dateKey(d); const out=[];
        state.tasks.filter(t=>t.dueAt && dateKey(parseDate(t.dueAt))===key).forEach(t=>out.push({title:t.title,color:subjectById(t.subjectId)?.color||'var(--accent)',minutes:t.estimate,time:t.dueAt?fmtTime(parseDate(t.dueAt)):'',type:'task',id:t.id}));
        state.exams.filter(e=>dateKey(parseDate(e.date))===key).forEach(e=>out.push({title:e.title,color:subjectById(e.subjectId)?.color||'var(--danger)',minutes:60,time:fmtTime(parseDate(e.date)),type:e.type,id:e.id}));
        state.classes.filter(c=>c.day===d.getDay()).forEach(c=>out.push({title:c.title,color:subjectById(c.subjectId)?.color||'var(--ok)',minutes:minutesBetween(`1970-01-01T${c.start}`,`1970-01-01T${c.end}`),time:`${c.start}-${c.end}`,type:'class',id:c.id}));
        return out;
      }

      function renderExams(){
        const now=new Date(); const upcoming=state.exams.filter(e=>parseDate(e.date)>=now).sort((a,b)=>parseDate(a.date)-parseDate(b.date));
        const past=state.exams.filter(e=>parseDate(e.date)<now).sort((a,b)=>parseDate(b.date)-parseDate(a.date));
        return `
        <div class="card">
          <div class="row between"><h2 class="title">${esc(t('upcoming'))}</h2><div class="row"><button class="btn primary" data-action="new-exam">${esc(t('addExam'))}</button><button class="btn" data-action="new-delivery">${esc(t('addDelivery'))}</button></div></div>
          <div class="list">${upcoming.length?upcoming.map(examRowHtml).join(''):emptyHtml(t('noExams'))}</div>
        </div>
        <div class="card" style="margin-top:12px"><h2 class="title">${esc(t('done'))}</h2><div class="list">${past.length?past.slice(0,10).map(examRowHtml).join(''):emptyHtml(t('noData'))}</div></div>`;
      }
      function examRowHtml(e){
        const d=parseDate(e.date); const days=Math.ceil((d-new Date())/DAY_MS); const subj=subjectById(e.subjectId);
        return `<div class="list-item"><div class="list-main"><div class="list-title">${esc(e.title)}</div><div class="meta"><span class="badge ${e.type==='exam'?'high':'medium'}">${esc(t(e.type))}</span><span><span class="dot" style="background:${esc(subj?.color||'var(--muted)')}"></span> ${esc(subj?.name||t('noSubjects'))}</span><span>${esc(fmtDateTime(d))}</span><span>${days>=0?`${days} ${t('daysLeft')}`:t('done')}</span></div><div class="progress"><span style="width:${e.readiness}%"></span></div></div><div class="row"><button class="icon-btn" data-action="exam-to-task" data-id="${e.id}">${icon('plus',16)}</button><button class="icon-btn" data-action="edit-exam" data-id="${e.id}">${icon('edit',16)}</button><button class="icon-btn" data-action="delete-exam" data-id="${e.id}">${icon('trash',16)}</button></div></div>`;
      }

      function renderFocus(){

            <div style="width:min(420px,90%)"><div class="progress"><span data-focus-progress style="width:${clamp(100-rem/a.plannedSec*100,0,100)}%"></span></div></div>

        }
        return `
        <div class="grid cols-2">
          <div class="card">
            <h2 class="title">${esc(t('startFocus'))}</h2>

              <label class="field full"><span>${esc(t('tasks'))}</span><select class="input" name="taskId"><option value="">${esc(t('noActiveSession'))}</option>${state.tasks.filter(x=>x.status!=='done').map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label>
              <label class="field"><span>${esc(t('workMin'))}</span><input class="input" type="number" name="minutes" min="1" max="240" value="${state.settings.pomodoro.work}"></label>
              <label class="field"><span>${esc(t('subject'))}</span><select class="input" name="subjectId"><option value="">—</option>${state.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
              <div class="full row">${[15,25,45,60].map(m=>`<button type="button" class="chip" data-action="focus-preset" data-min="${m}">${m} ${state.settings.lang==='ar'?'د':'min'}</button>`).join('')}</div>
              <div class="full"><button class="btn primary" type="submit">${icon('play',18)} ${esc(t('start'))}</button></div>
            </form>
          </div>
          <div class="card">
            <h2 class="title">${esc(t('todaySessions'))}</h2>
            <div class="kv"><span>${esc(t('completedSessions'))}</span><strong>${completed.length}</strong></div>
            <div class="kv"><span>${esc(t('totalFocus'))}</span><strong>${fmtDuration(completed.reduce((s,x)=>s+x.actualSec/60,0))}</strong></div>
            <div class="list" style="margin-top:10px">${todaySessions.length?todaySessions.map(sessionRowHtml).join(''):emptyHtml(t('noData'))}</div>
          </div>
        </div>`;
      }
      function sessionRowHtml(s){ return `<div class="list-item"><div class="list-main"><div class="list-title">${esc(s.taskId?taskById(s.taskId)?.title||'':subjectName(s.subjectId))}</div><div class="meta"><span>${esc(fmtDateTime(s.startedAt))}</span><span>${esc(fmtDuration(s.actualSec/60))}</span><span class="badge ${s.status==='completed'?'done':'new'}">${esc(s.status==='completed'?t('completed'):t('cancelled'))}</span></div></div></div>`; }

      function renderStats(){
        const days=7; const last=lastNDays(days); const values=last.map(d=>Math.round(focusMinutesOn(d))); const labels=last.map(d=>`${d.getDate()}/${d.getMonth()+1}`);
        const total=values.reduce((a,b)=>a+b,0); const avg=total/days;
        const done=state.tasks.filter(x=>x.status==='done').length; const totalTasks=state.tasks.length; const rate=totalTasks?Math.round(done/totalTasks*100):0;
        const subjMap=new Map(); completedSessions().forEach(s=>{ const k=s.subjectId||'none'; subjMap.set(k,(subjMap.get(k)||0)+s.actualSec/60); });
        const donut=Array.from(subjMap.entries()).map(([k,v])=>({label:k==='none'?t('noSubjects'):subjectName(k), value:v, color:k==='none'?'var(--muted)':subjectById(k)?.color||'var(--accent)'})).sort((a,b)=>b.value-a.value).slice(0,6);
        const dayTotals=[0,1,2,3,4,5,6].map(d=>completedSessions().filter(s=>new Date(s.startedAt).getDay()===d).reduce((a,s)=>a+s.actualSec/60,0));
        const bestDay=dayTotals.indexOf(Math.max(...dayTotals));
        return `
        <div class="grid stats">
          ${statCard(t('totalFocus'), fmtDuration(total), `${t('averageDaily')}: ${fmtDuration(avg)}`, 'focus')}
          ${statCard(t('completionRate'), rate+'%', `${done}/${totalTasks}`, 'check')}
          ${statCard(t('streak'), state.game.streak, t('last7Days'), 'trophy')}
          ${statCard(t('mostProductiveDay'), dayName(bestDay), fmtDuration(dayTotals[bestDay]), 'star')}
        </div>
        <div class="grid cols-2" style="margin-top:12px">
          <div class="card"><h2 class="title">${esc(t('dailyFocus'))}</h2>${barChart(values,labels)}</div>
          <div class="card"><h2 class="title">${esc(t('focusBySubject'))}</h2>${donutChart(donut)}</div>
        </div>
        <div class="card" style="margin-top:12px"><h2 class="title">${esc(t('badges'))}</h2><div class="row">${BADGES.map(b=>`<span class="chip ${state.game.badges[b.id]?'active':''}">${state.game.badges[b.id]?'🏆':''} ${esc(t(b.title))}</span>`).join('')}</div><div class="kv" style="margin-top:10px"><span>${esc(t('points'))}</span><strong>${state.game.points}</strong></div><div class="progress"><span style="width:${levelProgress(state.game.points)}%"></span></div></div>`;
      }
      function barChart(values, labels){
        if(!values.length || values.every(v=>!v)) return emptyHtml(t('noData'));
        const max=Math.max(...values,1); const w=300,h=140,bw=Math.max(8,(w-30)/values.length-6);
        let bars=''; values.forEach((v,i)=>{ const bh=Math.max(2,v/max*100); const x=15+i*((w-30)/values.length); const y=110-bh; bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="var(--accent)"><title>${esc(labels[i])}: ${v}</title></rect><text x="${x+bw/2}" y="125" text-anchor="middle" font-size="8" fill="var(--muted)">${esc(labels[i])}</text>`; });
        return `<svg class="chart" viewBox="0 0 ${w} ${h}">${bars}<line x1="10" y1="110" x2="${w-10}" y2="110" stroke="var(--border)"/></svg>`;
      }
      function donutChart(items){
        const total=items.reduce((s,i)=>s+i.value,0); if(!total) return emptyHtml(t('noData'));
        const r=42,c=2*Math.PI*r; let off=0, circles='', legend='';
        items.forEach(it=>{ const len=it.value/total*c; circles+=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${esc(it.color)}" stroke-width="16" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(it.label)}: ${Math.round(it.value)}</title></circle>`; off+=len; legend+=`<div class="legend-item"><span class="dot" style="background:${esc(it.color)}"></span><span>${esc(it.label)} (${Math.round(it.value/total*100)}%)</span></div>`; });
        return `<div class="row"><svg width="120" height="120" viewBox="0 0 120 120">${circles}<text x="60" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="var(--text)">${Math.round(total)}</text></svg><div class="legend">${legend}</div></div>`;
      }

      function renderHabits(){
        const days=lastNDays(7);
        return `<div class="card"><div class="row between"><h2 class="title">${esc(t('habitTracker'))}</h2><button class="btn primary" data-action="new-habit">${icon('plus',18)} ${esc(t('addHabit'))}</button></div>
        ${state.habits.length?`<div class="table-wrap" style="overflow:auto;margin-top:10px"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:start;padding:8px">${esc(t('habitName'))}</th>${days.map(d=>`<th style="padding:8px">${d.getDate()}</th>`).join('')}<th></th></tr></thead><tbody>${state.habits.map(h=>`<tr><td style="padding:8px;font-weight:800">${esc(h.title)}</td>${days.map(d=>`<td style="text-align:center"><input type="checkbox" ${h.logs.includes(dateKey(d))?'checked':''} data-action="toggle-habit" data-id="${h.id}" data-date="${dateKey(d)}"></td>`).join('')}<td><button class="icon-btn" data-action="delete-habit" data-id="${h.id}">${icon('trash',16)}</button></td></tr>`).join('')}</tbody></table></div>`:emptyHtml(t('noData'))}

        <label class="field" style="margin-top:10px"><span>${esc(t('targetGpa'))}</span><input class="input" type="number" step="0.01" min="0" max="5" value="${state.gpaTarget}" data-action="gpa-target"></label>

      /* =========================
         12) parsing quick add
         ========================= */
      function parseQuickAdd(text){
        let title=text.trim(); const res={ title, tags:[], priority:'medium', dueAt:null, estimate:25, subjectId:null };
        title=title.replace(/#(\S+)/g,(m,w)=>{res.tags.push(w);return '';});
        if(/!(high|عالية|عاجل)/i.test(title)){res.priority='high'; title=title.replace(/!(high|عالية|عاجل)/gi,'');}
        if(/!(low|منخفض|منخفضة)/i.test(title)){res.priority='low'; title=title.replace(/!(low|منخفض|منخفضة)/gi,'');}
        state.subjects.forEach(s=>{ if(title.includes(s.name)){ res.subjectId=s.id; title=title.replace(s.name,' '); } });
        const now=new Date(); let d=new Date(); let hasDate=false;
        if(/اليوم|today/i.test(title)){hasDate=true; title=title.replace(/اليوم|today/gi,'');}
        if(/بكرة|غدًا|غدا|tomorrow/i.test(title)){d=addDays(now,1); hasDate=true; title=title.replace(/بكرة|غدًا|غدا|tomorrow/gi,'');}
        const afterDays=title.match(/بعد\s*(\d+)\s*(يوم|أيام|days?)/i); if(afterDays){d=addDays(now,Number(afterDays[1])); hasDate=true; title=title.replace(afterDays[0],'');}
        if(/أسبوع|week/i.test(title)){d=addDays(now,7); hasDate=true; title=title.replace(/أسبوع|week/gi,'');}
        const timeMatch=title.match(/(?:الساعة\s*)?([01]?\d|2[0-3])[:\s\.]?([0-5]\d)?\s*(ص|م|am|pm)?/i);
        if(timeMatch){ let h=Number(timeMatch[1]); const m=Number(timeMatch[2]||0); const mer=(timeMatch[3]||'').toLowerCase(); if(['م','pm'].includes(mer) && h<12) h+=12; if(['ص','am'].includes(mer) && h===12) h=0; d.setHours(h,m,0,0); if(!hasDate && d<now) d=addDays(d,1); res.dueAt=d.toISOString(); title=title.replace(timeMatch[0],''); }
        else if(hasDate){ d.setHours(20,0,0,0); res.dueAt=d.toISOString(); }
        const estMin=title.match(/(\d+)\s*(د|دقيقة|دقائق|min|minutes?)/i); const estHour=title.match(/(\d+)\s*(س|ساعة|ساعات|h|hours?)/i);
        if(estMin){res.estimate=Number(estMin[1]); title=title.replace(estMin[0],'');} else if(estHour){res.estimate=Number(estHour[1])*60; title=title.replace(estHour[0],'');}
        res.title=title.replace(/\s+/g,' ').trim() || text.trim();
        return res;
      }

      document.addEventListener('click', async e => {
        const el=e.target.closest('[data-action]');
        if(!el) return;
        const a=el.dataset.action; const id=el.dataset.id;
        switch(a){
          case 'set-lang': state.settings.lang=el.dataset.lang; saveState(); render(); break;
          case 'google-login': await signInWithGoogle($('#rememberBox')?.checked ?? true); break;
          case 'guest-login': setGuestActive(true, $('#rememberBox')?.checked ?? true); state.auth={...DEFAULT_STATE.auth}; saveState(false); render(); break;
          case 'toggle-sidebar': state.ui.sidebarOpen=!state.ui.sidebarOpen; render(); break;
          case 'close-sidebar': state.ui.sidebarOpen=false; render(); break;
          case 'nav': state.ui.view=el.dataset.view; state.ui.sidebarOpen=false; saveState(false); render(); break;
          case 'toggle-theme': state.settings.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'; saveState(); render(); break;
          case 'open-alerts': openAlertsModal(); break;
          case 'mark-alerts-read': getAlerts().forEach(x=>state.notifications.seen[alertKey(x)]=true); saveState(); updateBell(); modalStack.at(-1)?.close(); break;
          case 'open-alert': { const type=el.dataset.type; if(type==='task') openTaskModal(id); else openExamModal(id); modalStack.at(-1)?.close(); break; }
          case 'new-task': openTaskModal(null, { dueAt: el.dataset.date ? el.dataset.date+'T12:00' : '' }); break;
          case 'edit-task': openTaskModal(id); break;
          case 'delete-task': if(await confirmModal({title:t('delete'),message:t('delete'),danger:true,confirmText:t('delete')})) Tasks.remove(id); break;
          case 'delete-task-from-modal': if(await confirmModal({title:t('delete'),message:t('delete'),danger:true,confirmText:t('delete')})){ Tasks.remove(id); modalStack.at(-1)?.close(); } break;
          case 'save-task': { const form=$('#taskForm'); if(saveTaskForm(form)) modalStack.at(-1)?.close(); break; }
          case 'add-subtask': { const ed=el.closest('.modal').querySelector('.subtasks-editor'); const div=document.createElement('div'); div.innerHTML=subtaskRowHtml(); ed.appendChild(div.firstElementChild); break; }
          case 'remove-subtask': el.closest('.subtask-row').remove(); break;
          case 'toggle-task': Tasks.toggle(id); break;
          case 'focus-task': state.ui.focusTask=id; navigate('focus'); break;
          case 'task-filter': state.ui.taskFilter=el.dataset.filter; saveState(false); $('#tasksContent').innerHTML=renderTasksContent(); render(); break;
          case 'toggle-task-view': state.ui.taskView=state.ui.taskView==='list'?'kanban':'list'; saveState(false); render(); break;
          case 'undo-last': undoFn?.fn(); undoFn=null; break;
          case 'new-subject': openSubjectModal(); break;
          case 'edit-subject': openSubjectModal(id); break;
          case 'delete-subject': Subjects.remove(id); break;
          case 'save-subject': { const form=$('#subjectForm'); const fd=new FormData(form); const name=fd.get('name').trim(); if(!name){toast(t('requiredTitle'),'error');break;} Subjects.upsert({id:form.dataset.id||uid(), name, color:fd.get('color'), description:fd.get('description')}); modalStack.at(-1)?.close(); render(); toast(t('saved'),'success'); break; }
          case 'new-exam': openExamModal(null,'exam'); break;
          case 'new-delivery': openExamModal(null,'delivery'); break;

          case 'delete-exam': if(await confirmModal({title:t('delete'),message:t('delete'),danger:true,confirmText:t('delete')})) Exams.remove(id); break;
          case 'save-exam': { const form=$('#examForm'); const fd=new FormData(form); if(!fd.get('title').trim() || !parseDate(fd.get('date'))){toast(t('requiredTitle'),'error');break;} Exams.upsert({id:form.dataset.id||uid(), title:fd.get('title'), subjectId:fd.get('subjectId')||null, date:fd.get('date'), type:fd.get('type'), topics:fd.get('topics'), plan:fd.get('plan'), readiness:num(fd.get('readiness'),0)}); modalStack.at(-1)?.close(); render(); toast(t('saved'),'success'); break; }

          case 'cal-prev': shiftCalendar(-1); break;
          case 'cal-next': shiftCalendar(1); break;
          case 'cal-today': state.ui.calendarAnchor=new Date().toISOString(); render(); break;
          case 'cal-mode': state.ui.calendarMode=el.dataset.mode; render(); break;
          case 'cal-day': { const date=el.dataset.date; openModal({ title:fmtDate(date), body:`<div class="list">${dayEvents(parseDate(date)).map(ev=>`<div class="list-item"><div class="list-main"><div class="list-title">${esc(ev.title)}</div><div class="meta"><span>${esc(ev.time||'')}</span></div></div></div>`).join('')||emptyHtml(t('noTasks'))}</div>`, footer:`<button class="btn primary" data-action="new-task" data-date="${date}">${esc(t('addTask'))}</button><button class="btn" data-close>${esc(t('close'))}</button>` }); break; }
          case 'open-planner': openPlannerModal(); break;
          case 'plan-remove': { const i=Number(el.dataset.index); state.ui.planDraft.plan.splice(i,1); modalStack.at(-1)?.close(); openPlannerModal(); break; }
          case 'plan-accept': { const draft=state.ui.planDraft; if(draft?.plan?.length){ startFocus({taskId:draft.plan[0].taskId, minutes:draft.plan[0].minutes}); toast(t('planAccepted'),'success'); } modalStack.at(-1)?.close(); state.ui.planDraft=null; break; }
          case 'plan-reject': state.ui.planDraft=null; modalStack.at(-1)?.close(); toast(t('planRejected'),'info'); break;

          case 'focus-pause': pauseFocus(); break;
          case 'focus-resume': resumeFocus(); break;
          case 'focus-stop': if(await confirmModal({title:t('stop'),message:t('cancelled'),danger:true,confirmText:t('stop')})) stopFocus(true); break;
          case 'focus-finish': if(await confirmModal({title:t('complete'),message:t('sessionLogged'),confirmText:t('complete')})) finishFocusEarly(); break;
          case 'focus-recover-complete': logSession(state.activeFocus,'completed',state.activeFocus.plannedSec); state.activeFocus=null; saveState(); modalStack.at(-1)?.close(); render(); break;
          case 'focus-recover-cancel': stopFocus(true); modalStack.at(-1)?.close(); break;
          case 'new-habit': openHabitModal(); break;
          case 'save-habit': { const fd=new FormData($('#habitForm')); if(!fd.get('title').trim()){toast(t('requiredTitle'),'error');break;} Habits.upsert({id:uid(), title:fd.get('title')}); modalStack.at(-1)?.close(); render(); break; }
          case 'toggle-habit': Habits.toggle(id, el.dataset.date); break;
          case 'delete-habit': Habits.remove(id); render(); break;
          case 'new-course': openCourseModal(); break;
          case 'edit-course': openCourseModal(id); break;
          case 'delete-course': Courses.remove(id); render(); break;
          case 'save-course': { const form=$('#courseForm'); const fd=new FormData(form); if(!fd.get('name').trim()){toast(t('requiredTitle'),'error');break;} Courses.upsert({id:form.dataset.id||uid(), name:fd.get('name'), credits:num(fd.get('credits'),3), grade:fd.get('grade')}); modalStack.at(-1)?.close(); render(); break; }
          case 'new-note': openNoteModal(); break;
          case 'edit-note': openNoteModal(id); break;
          case 'delete-note': if(await confirmModal({title:t('delete'),message:t('delete'),danger:true,confirmText:t('delete')})) Notes.remove(id); break;
          case 'save-note': { const form=$('#noteForm'); const fd=new FormData(form); if(!fd.get('title').trim()){toast(t('requiredTitle'),'error');break;} Notes.upsert({id:form.dataset.id||uid(), title:fd.get('title'), content:fd.get('content'), subjectId:fd.get('subjectId')||null, keywords:fd.get('keywords')}); modalStack.at(-1)?.close(); render(); toast(t('saved'),'success'); break; }
          case 'request-notifications': requestNotificationPermission(); break;
          case 'export-json': exportJSON(); break;
          case 'import-json': importJSON(); break;
          case 'export-csv': exportTasksCSV(); break;
          case 'delete-all': await deleteAllData(); break;
          case 'open-about': openAboutModal(); break;
          case 'logout': await signOutUser(); break;
        }
      });

      document.addEventListener('submit', e => {
        e.preventDefault();
        const form=e.target;
        if(form.id==='quickAddForm'){ const fd=new FormData(form); const parsed=parseQuickAdd(fd.get('text')); Tasks.create(parsed); form.reset(); render(); toast(t('saved'),'success'); }
        if(form.id==='focusSetupForm'){ const fd=new FormData(form); startFocus({ taskId:fd.get('taskId')||null, subjectId:fd.get('subjectId')||null, minutes:clamp(Math.round(num(fd.get('minutes'),25)),1,240) }); }
      });

      document.addEventListener('input', debounce(e => {
        if(e.target.id==='taskSearch'){ state.ui.taskSearch=e.target.value; const c=$('#tasksContent'); if(c) c.innerHTML=renderTasksContent(); }
        if(e.target.id==='noteSearch'){ state.ui.noteSearch=e.target.value; render(); }
        if(e.target.matches('[data-action="gpa-target"]')){ state.gpaTarget=num(e.target.value,3); saveState(); }
      }, 180));

      document.addEventListener('change', e => {
        if(e.target.id==='taskSort'){ state.ui.taskSort=e.target.value; saveState(false); $('#tasksContent').innerHTML=renderTasksContent(); }
      });

      document.addEventListener('keydown', e => {
        if(e.key==='Escape' && modalStack.length){ modalStack.at(-1).close(); return; }
        if(e.target.matches('input,textarea,select,[contenteditable="true"]')) return;
        if(modalStack.length) return;
        if(e.key.toLowerCase()==='n'){ openTaskModal(); }
        if(e.key==='/'){ e.preventDefault(); state.ui.view='tasks'; render(); setTimeout(()=>$('#taskSearch')?.focus(),50); }
      });

      document.addEventListener('dragstart', e => { const card=e.target.closest('.kanban-card'); if(card) e.dataTransfer.setData('text/plain', card.dataset.id); });
      document.addEventListener('dragover', e => { const col=e.target.closest('.kanban-col'); if(col){ e.preventDefault(); col.classList.add('dragover'); } });
      document.addEventListener('dragleave', e => { const col=e.target.closest('.kanban-col'); if(col) col.classList.remove('dragover'); });
      document.addEventListener('drop', e => { const col=e.target.closest('.kanban-col'); if(!col)return; e.preventDefault(); col.classList.remove('dragover'); const id=e.dataTransfer.getData('text/plain'); const status=col.dataset.status; if(status==='done') Tasks.complete(id); else Tasks.setStatus(id,status); });

      function saveTaskForm(form){
        const fd=new FormData(form); const title=String(fd.get('title')||'').trim();
        if(!title){ toast(t('requiredTitle'),'error'); return false; }
        const dueRaw=fd.get('dueAt'); const dueDate=dueRaw?parseDate(dueRaw):null;
        if(dueRaw && !dueDate){ toast(t('invalidDate'),'error'); return false; }
        const subtasks=$$('.subtask-row', form).map(row=>({ id:row.dataset.id||uid(), title:row.querySelector('[name=subtaskTitle]').value.trim(), done:row.querySelector('input[type=checkbox]').checked })).filter(x=>x.title);
        const data={ id:form.dataset.id||uid(), title, description:fd.get('description'), subjectId:fd.get('subjectId')||null, priority:fd.get('priority'), status:fd.get('status'), dueAt:dueDate?dueDate.toISOString():null, estimate:Math.max(0,num(fd.get('estimate'),25)), tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean), link:fd.get('link'), notes:fd.get('notes'), subtasks, repeat:fd.get('repeat'), repeatInterval:Math.max(1,num(fd.get('repeatInterval'),7)) };
        const existing=taskById(data.id);
        Tasks.update(existing?data.id:null, data);
        if(!existing) Tasks.create(data); else saveState();
        toast(t('saved'),'success'); return true;
      }

      function shiftCalendar(dir){
        const a=parseDate(state.ui.calendarAnchor)||new Date();
        if((state.ui.calendarMode||'month')==='month') a.setMonth(a.getMonth()+dir); else a.setDate(a.getDate()+7*dir);
        state.ui.calendarAnchor=a.toISOString(); render();
      }
      function navigate(view){ state.ui.view=view; saveState(false); render(); }

      function exportJSON(){ download(`munjiz-${dateKey(new Date())}.json`, JSON.stringify(state,null,2), 'application/json'); toast(t('exported'),'success'); }
      function exportTasksCSV(){ const rows=[['id','title','subject','priority','status','dueAt','estimate','actualMin','progress']]; state.tasks.forEach(t=>rows.push([t.id,t.title,subjectName(t.subjectId),t.priority,t.status,t.dueAt||'',t.estimate,t.actualMin,t.progress])); download(`munjiz-tasks-${dateKey(new Date())}.csv`, toCSV(rows), 'text/csv'); toast(t('exported'),'success'); }
      function importJSON(){
        const input=document.createElement('input'); input.type='file'; input.accept='application/json,.json';
        input.onchange=async ()=>{ const file=input.files?.[0]; if(!file)return; const reader=new FileReader(); reader.onload=async ()=>{ try{ const obj=JSON.parse(reader.result); if(!obj || !Array.isArray(obj.tasks)) throw new Error('bad'); if(!await confirmModal({title:t('importJson'),message:t('deleteAllWarning'),danger:true,confirmText:t('confirm')})) return; state=normalizeState(obj); saveState(false); applySettings(); render(); toast(t('imported'),'success'); }catch{ toast(t('importFailed'),'error'); } }; reader.readAsText(file); };
        input.click();
      }
      async function deleteAllData(){
        if(!await confirmModal({title:t('deleteAll'),message:t('deleteAllWarning'),danger:true,confirmText:t('confirm')})) return;
        if(!await dangerConfirm({title:t('doubleConfirm'),message:t('deleteAllWarning'),keyword:state.settings.lang==='ar'?'حذف':'delete'})) return;
        localStorage.removeItem(STORAGE_KEY); setGuestActive(false); state=normalizeState({}); saveState(false); render(); toast(t('deleted'),'success');
      }

      /* =========================
         14) التهيئة
         ========================= */
      async function registerSW(){
        if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
          try { await navigator.serviceWorker.register('sw.js'); } catch(e){ console.warn(e); }
        }
      }

      async function init(){
        applySettings(); render();
        await initFirebase();
        watchAuth();
        recoverFocus();
        setInterval(checkNotifications, 60000);
        setInterval(()=>{ if(['home','tasks','calendar','exams'].includes(state.ui.view)) render(); }, 60000);
        registerSW();
        setTimeout(maybeMorningSummary, 800);
      }

      init();
    })();
  </script>
</body>
</html>
