      function normalizeState(input) {
        const s = input && typeof input === 'object' ? input : {};

        if(!out.game.frames.unlocked.includes('none')) out.game.frames.unlocked.unshift('none');
        if(!out.game.titles.unlocked.includes('student')) out.game.titles.unlocked.unshift('student');

        out.game.badges=out.game.badges&&typeof out.game.badges==='object'?out.game.badges:{};

        out.sessions=Array.isArray(s.sessions)?s.sessions.map(normalizeSession):[];

        out.leaderboard={...DEFAULT_STATE.leaderboard,...(s.leaderboard||{})};

        out.developer.inquiries=Array.isArray(out.developer.inquiries)?out.developer.inquiries:[];

        const list=getProfiles(); list.push(profile); saveProfiles(list);
        const st=normalizeState({settings:{...state.settings},profile:{name:profile.name,avatarColor:profile.color,photo:profile.photo||profile.photoURL},auth:{provider:profile.provider==='local'?'guest':'firebase',uid:profile.uid||'guest',displayName:profile.name,email:profile.email,photoURL:profile.photoURL}});

      function bootProfile(){
        const id=localStorage.getItem(LS.active); const list=getProfiles(); const p=list.find(x=>x.id===id);

      const fb={ready:false,app:null,auth:null,db:null};

      function hasFirebaseConfig(){ return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId); }
      function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=()=>rej(new Error(src)); document.head.appendChild(s); }); }
      async function initFirebase(){

      function authError(code){
        const map={'auth/popup-closed-by-user':'invalidCredentials','auth/cancelled-popup-request':'invalidCredentials','auth/network-request-failed':'requiresFirebase','auth/unauthorized-domain':'requiresFirebase','auth/operation-not-allowed':'requiresFirebase','auth/account-exists-with-different-credential':'invalidCredentials','auth/invalid-email':'invalidCredentials','auth/user-not-found':'invalidCredentials','auth/wrong-password':'invalidCredentials','auth/invalid-credential':'invalidCredentials','auth/email-already-in-use':'invalidCredentials','auth/weak-password':'invalidCredentials'};
        return t(map[code]||'invalidCredentials');

      async function loginWithEmail(email,password,remember=true){ if(!fb.ready){toast(t('requiresFirebase'),'warn');return false;} try{ await setPersistence(remember); await fb.auth.signInWithEmailAndPassword(String(email).trim(),password); return true; }catch(e){ toast(authError(e.code),'error'); return false; } }
      async function registerWithEmail(name,email,password,remember=true){ if(!fb.ready){toast(t('requiresFirebase'),'warn');return false;} if(String(password).length<6){toast(t('invalidCredentials'),'error');return false;} try{ await setPersistence(remember); const c=await fb.auth.createUserWithEmailAndPassword(String(email).trim(),password); await c.user.updateProfile({displayName:String(name).trim()||email}); return true; }catch(e){ toast(authError(e.code),'error'); return false; } }
      async function resetPassword(email){ if(!fb.ready){toast(t('requiresFirebase'),'warn');return false;} try{ await fb.auth.sendPasswordResetEmail(String(email).trim()); toast(t('savedMsg'),'success'); return true; }catch(e){ toast(authError(e.code),'error'); return false; } }
      async function logout(){
        try{ if(fb.ready && fb.auth.currentUser) await fb.auth.signOut(); }catch{}

      function scheduleSync(){ if(!fb.ready || state.auth.provider!=='firebase') return; clearTimeout(syncTimer); syncTimer=setTimeout(pushCloud,1200); }
      async function pushCloud(){
        if(!fb.ready || state.auth.provider!=='firebase' || !state.auth.uid || state.auth.uid==='guest') return;
        try{ const clean=JSON.parse(JSON.stringify(state)); clean.developer={unlocked:false,logs:[],flags:{},inquiries:[]}; await fb.db.collection('users').doc(state.auth.uid).collection('data').doc('main').set({state:clean,updatedAt:state.updatedAt},{merge:true}); }catch(e){ console.warn(e); }
      }

        if(!fb.ready || state.auth.provider!=='firebase' || !state.auth.uid || state.auth.uid==='guest') return;

          const snap=await fb.db.collection('users').doc(state.auth.uid).collection('data').doc('main').get();
          if(snap.exists){ const data=snap.data(); const cloud=normalizeState(data.state||{}); if((data.updatedAt||0)>state.updatedAt){ const dev=state.developer.unlocked; state=cloud; state.developer.unlocked=dev; window.__state=state; if(activeProfile) saveProfile(activeProfile.id,state); applySettings(); } else await pushCloud(); } else await pushCloud();
        }catch(e){ console.warn(e); }

      let badgeLock=false;

        markStudyDay(){ const k=dateKey(new Date()); if(!state.game.studyDates.includes(k)) state.game.studyDates.push(k); this.updateStreak(); },
        updateStreak(){ const dates=new Set(state.game.studyDates); let cur=dateKey(new Date()); if(!dates.has(cur)) cur=dateKey(addDays(new Date(),-1)); let c=0; while(dates.has(cur)){ c++; cur=dateKey(addDays(parseDate(cur+'T00:00')||new Date(),-1)); } state.game.streak=c; state.game.bestStreak=Math.max(state.game.bestStreak||0,c); },
        completeTaskReward(task){ let xp=20+(task.priority==='high'?15:task.priority==='medium'?8:0)+task.subtasks.filter(s=>s.done).length*3; this.recordFirstCompletion(); this.markStudyDay(); this.addXp(xp); celebrate(); },
        focusReward(sec){ this.markStudyDay(); this.addXp(Math.max(1,Math.round(sec/60))); },
        recordFirstCompletion(){ const today=dateKey(new Date()); if(state.game.firstCompletionDate!==today){ state.game.firstCompletionDate=today; state.game.firstCompletionAt=iso(); } },
        unlockFrame(id){ if(!FRAME_DEFS.some(f=>f.id===id)) return; if(!state.game.frames.unlocked.includes(id)){ state.game.frames.unlocked.push(id); toast(`${t('frameUnlocked')}: ${frameName(id)}`,'success'); saveState(false); } },
        unlockTitle(id){ if(!TITLE_DEFS.some(f=>f.id===id)) return; if(!state.game.titles.unlocked.includes(id)){ state.game.titles.unlocked.push(id); toast(`${t('titleUnlocked')}: ${titleName(id)}`,'success'); saveState(false); } },

        equipTitle(id){ if(!state.game.titles.unlocked.includes(id)){ toast(t('locked'),'warn'); return; } state.game.titles.equipped=id; saveState(); render(); toast(t('equipped'),'success'); },
        checkBadges(){ if(badgeLock) return; badgeLock=true; BADGE_DEFS.forEach(b=>{ try{ if(!state.game.badges[b.id] && b.check()){ state.game.badges[b.id]={at:iso()}; toast(`${t('badgeUnlocked')}: ${badgeName(b.id)}`,'success'); this.unlockFrameByBadge(b.id); this.unlockTitleByBadge(b.id); this.addXp(b.xp||20,true); } }catch{} }); badgeLock=false; saveState(false); }

      let undoFn=null;
      const Tasks={
        create(data){ const task=normalizeTask(data); state.tasks.unshift(task); saveState(); Gamification.checkBadges(); return task; },

        remove(id){ const i=state.tasks.findIndex(x=>x.id===id); if(i<0)return; const item=state.tasks[i]; state.tasks.splice(i,1); saveState(); undoFn=()=>{state.tasks.splice(i,0,item);saveState();render();}; toast(t('deleted'),'info',{label:t('undo'),action:'undo'}); },
        complete(id){ const x=taskById(id); if(!x||x.status==='done')return; x.status='done'; x.completedAt=iso(); x.subtasks.forEach(s=>s.done=true); x.progress=100; Gamification.completeTaskReward(x); if(x.repeat!=='none' && x.dueAt){ const days=x.repeat==='daily'?1:x.repeat==='weekly'?7:x.repeatInterval; state.tasks.unshift(normalizeTask({...x,id:uid(),status:'new',completedAt:null,dueAt:new Date(parseDate(x.dueAt).getTime()+days*DAY).toISOString(),subtasks:x.subtasks.map(s=>({id:uid(),title:s.title,done:false})),progress:0,actualMin:0})); toast(t('nextOccurrence'),'info'); } saveState(); Gamification.checkBadges(); render(); toast(t('taskCompleted'),'success'); },
        toggle(id){ const x=taskById(id); if(!x)return; if(x.status==='done') Tasks.update(id,{status:'new',completedAt:null}); else Tasks.complete(id); }
      };
      const Subjects={ upsert(d){ const s=normalizeSubject(d); const i=state.subjects.findIndex(x=>x.id===s.id); if(i>=0)state.subjects[i]=s; else state.subjects.push(s); saveState(); return s; }, remove(id){ state.tasks.forEach(t=>{if(t.subjectId===id)t.subjectId=null;}); state.subjects=state.subjects.filter(x=>x.id!==id); saveState(); toast(t('deleted'),'success'); } };
      const Groups={ upsert(d){ const g=normalizeGroup(d); const i=state.groups.findIndex(x=>x.id===g.id); if(i>=0)state.groups[i]=g; else state.groups.unshift(g); saveState(); Gamification.checkBadges(); return g; }, remove(id){ state.groups=state.groups.filter(x=>x.id!==id); state.tasks.forEach(t=>{if(t.groupId===id)t.groupId=null;}); saveState(); toast(t('deleted'),'success'); } };
      const Teams={
        async create(d){ const g=normalizeTeam(d); if(fb.ready && state.auth.provider==='firebase' && state.auth.uid){ g.ownerId=state.auth.uid; g.memberIds=[state.auth.uid]; g.shared=true; const ref=await fb.db.collection('teams').add({...g,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); g.id=ref.id; } else { g.ownerId='local'; g.memberIds=['local']; } state.teams.unshift(g); state.activeTeamId=g.id; saveState(); Gamification.checkBadges(); publishProfileToCloud(); toast(t('teamCreated'),'success'); return g; },
        async joinByCode(code){ const c=String(code||'').trim().toUpperCase(); if(!c){toast(t('invalidTeamCode'),'error');return false;} if(!fb.ready || state.auth.provider!=='firebase'){toast(t('requiresFirebase'),'warn');return false;} try{ const snap=await fb.db.collection('teams').where('joinCode','==',c).limit(1).get(); if(snap.empty){toast(t('invalidTeamCode'),'error');return false;} const doc=snap.docs[0]; const data=doc.data(); const members=data.memberIds||[]; if(members.includes(state.auth.uid)){toast(t('alreadyInTeam'),'warn');return false;} await doc.ref.update({memberIds:firebase.firestore.FieldValue.arrayUnion(state.auth.uid),updatedAt:iso()}); const team=normalizeTeam({id:doc.id,...data,memberIds:[...members,state.auth.uid]}); const i=state.teams.findIndex(x=>x.id===team.id); if(i>=0)state.teams[i]=team; else state.teams.unshift(team); state.activeTeamId=team.id; saveState(); Gamification.checkBadges(); toast(t('teamJoined'),'success'); return true; }catch{ toast(t('invalidTeamCode'),'error'); return false; } },
        async leave(id){ const team=teamById(id); if(!team)return; if(team.shared && fb.ready && state.auth.uid){ if(!team.memberIds.includes(state.auth.uid)){toast(t('notInTeam'),'warn');return;} await fb.db.collection('teams').doc(id).update({memberIds:firebase.firestore.FieldValue.arrayRemove(state.auth.uid),updatedAt:iso()}); } state.teams=state.teams.filter(x=>x.id!==id); if(state.activeTeamId===id)state.activeTeamId=state.teams[0]?.id||null; saveState(); toast(t('teamLeft'),'success'); },
        async delete(id){ const team=teamById(id); if(!team)return; if(team.shared && fb.ready && state.auth.uid===team.ownerId) await fb.db.collection('teams').doc(id).delete().catch(()=>{}); state.teams=state.teams.filter(x=>x.id!==id); if(state.activeTeamId===id)state.activeTeamId=state.teams[0]?.id||null; saveState(); toast(t('deleted'),'success'); },
        setActive(id){ state.activeTeamId=id; saveState(); render(); },
        async fetch(){ if(!fb.ready || state.auth.provider!=='firebase' || !state.auth.uid)return; try{ const snap=await fb.db.collection('teams').where('memberIds','array-contains',state.auth.uid).limit(50).get(); const cloud=snap.docs.map(d=>normalizeTeam({id:d.id,...d.data()})); state.teams=[...cloud,...state.teams.filter(t=>!t.shared)]; if(state.activeTeamId && !state.teams.some(t=>t.id===state.activeTeamId)) state.activeTeamId=state.teams[0]?.id||null; saveState(false); }catch(e){ console.warn(e); } }
      };
      const Challenges={
        async create(d){ const c=normalizeChallenge({...d,ownerId:state.auth.uid||'local'}); if(fb.ready && state.auth.provider==='firebase' && state.auth.uid){ c.source='cloud'; const ref=await fb.db.collection('challenges').add({...c,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); c.id=ref.id; state.challenges.cloud.unshift(c); } else { c.source='local'; state.challenges.local.unshift(c); } saveState(); toast(t('savedMsg'),'success'); return c; },
        async fetchCloud(){ if(!fb.ready || state.auth.provider!=='firebase')return []; try{ const snap=await fb.db.collection('challenges').orderBy('endsAt','asc').limit(50).get(); state.challenges.cloud=snap.docs.map(d=>normalizeChallenge({id:d.id,...d.data()})).filter(c=>c.status==='active'&&new Date(c.endsAt)>=new Date()); saveState(false); return state.challenges.cloud; }catch{return[];} },
        async join(id,source='cloud'){ const u=state.auth.uid||activeProfile?.id||'local'; if(source==='local'){ const c=state.challenges.local.find(x=>x.id===id); if(c&&!c.participants.includes(u))c.participants.push(u); saveState(); toast(t('challengeJoined'),'success'); return; } if(!fb.ready)return; try{ await fb.db.collection('challenges').doc(id).collection('participants').doc(u).set({joinedAt:iso(),uid:u}); const c=state.challenges.cloud.find(x=>x.id===id); if(c&&!c.participants.includes(u))c.participants.push(u); saveState(false); toast(t('challengeJoined'),'success'); }catch{ toast(t('requiresFirebase'),'error'); } },
        async submit(id,source='cloud'){ const u=state.auth.uid||activeProfile?.id||'local'; const at=iso(); if(source==='local'){ const c=state.challenges.local.find(x=>x.id===id); if(!c)return; c.submissions.push({uid:u,at}); c.submissions.sort((a,b)=>new Date(a.at)-new Date(b.at)); if(c.submissions[0]?.uid===u){ state.game.raceWins++; Gamification.addXp(c.rewardXp||50); toast(t('challengeWon'),'success'); } state.game.challengeWins++; saveState(); Gamification.checkBadges(); toast(t('challengeSubmitted'),'success'); return; } if(!fb.ready)return; try{ await fb.db.collection('challenges').doc(id).collection('submissions').doc(u).set({uid:u,at}); const first=await fb.db.collection('challenges').doc(id).collection('submissions').orderBy('at','asc').limit(1).get(); if(first.docs[0]?.id===u){ state.game.raceWins++; Gamification.addXp(80); toast(t('challengeWon'),'success'); } state.game.challengeWins++; Gamification.addXp(30); saveState(); toast(t('challengeSubmitted'),'success'); }catch{ toast(t('requiresFirebase'),'error'); } }
      };
      const Leaderboard={
        localRow(){ return {id:state.auth.uid||activeProfile?.id||'local',displayName:state.profile.name||(state.settings.lang==='ar'?'أنت':'You'),avatarColor:state.profile.avatarColor,photo:state.auth.photoURL||'',title:titleName(state.game.titles.equipped),frame:state.game.frames.equipped,xp:state.game.xp,level:state.game.level,streak:state.game.streak,tasksCompleted:state.tasks.filter(t=>t.status==='done').length,focusMinutes:Math.round(completedSessions().reduce((s,x)=>s+x.actualSec/60,0)),firstCompletionAt:state.game.firstCompletionAt,local:true}; },
        local(){ state.leaderboard.cache=[this.localRow()]; state.leaderboard.updatedAt=iso(); saveState(false); },
        async fetch(tab='global'){
          state.ui.leaderboardTab=tab; state.leaderboard.tab=tab;
          if(!fb.ready || state.auth.provider!=='firebase'){ this.local(); render(); return; }
          try{
            if(tab==='team'){
              const team=teamById(state.activeTeamId);
              if(!team){ this.local(); render(); return; }
              const ids=team.shared?team.memberIds.slice(0,50):[activeProfile?.id||'local'];
              const rows=[];
              for(const id of ids){ if(team.shared){ const s=await fb.db.collection('publicProfiles').doc(id).get(); if(s.exists) rows.push({id,...s.data()}); } else rows.push(this.localRow()); }
              rows.sort((a,b)=>(b.xp||0)-(a.xp||0)); state.leaderboard.cache=rows;

              let rows=snap.docs.map(d=>({id:d.id,...d.data()}));
              if(tab==='daily'){ const today=dateKey(new Date()); rows=rows.filter(r=>r.firstCompletionDate===today).sort((a,b)=>new Date(a.firstCompletionAt||0)-new Date(b.firstCompletionAt||0)); }
              state.leaderboard.cache=rows;

            state.leaderboard.updatedAt=iso(); saveState(false); render();
          }catch{ this.local(); render(); }
        }
      };

      /* =========================
         9) Focus
         ========================= */
      let timerInterval=null;
      function ensureTimer(){ if(!timerInterval) timerInterval=setInterval(tickTimer,1000); }
      function activeElapsedMs(){ const a=state.activeFocus; return a?a.accumulatedMs+(a.pausedAt?0:Date.now()-a.startedAt):0; }
      function activeRemainingSec(){ const a=state.activeFocus; return a?Math.max(0,Math.ceil((a.plannedSec*1000-activeElapsedMs())/1000)):0; }
      function startFocus({taskId=null,subjectId=null,minutes=25,mode='focus'}={}){
        if(state.activeFocus){ toast(t('currentSession'),'warn'); return; }
        const task=taskId?taskById(taskId):null;
        state.activeFocus=normalizeActive({sessionId:uid(),taskId,subjectId:subjectId||task?.subjectId||null,mode,plannedSec:Math.max(1,Math.round(minutes*60)),startedAt:Date.now(),pausedAt:null,accumulatedMs:0,cycle:completedSessions().filter(s=>sameDay(new Date(s.startedAt),new Date())).length+1});
        if(task && task.status==='new') Tasks.update(task.id,{status:'inProgress'});
        saveState(); ensureTimer(); render(); toast(mode==='focus'?t('start'):t('shortBreak'),'success');
      }
      function pauseFocus(){ const a=state.activeFocus; if(!a||a.pausedAt)return; a.accumulatedMs+=Date.now()-a.startedAt; a.pausedAt=Date.now(); saveState(); updateFocusUI(); }
      function resumeFocus(){ const a=state.activeFocus; if(!a||!a.pausedAt)return; a.startedAt=Date.now(); a.pausedAt=null; saveState(); updateFocusUI(); }
      function stopFocus(){ const a=state.activeFocus; if(!a)return; const sec=Math.floor(activeElapsedMs()/1000); if(sec>10) logSession(a,'cancelled',sec); state.activeFocus=null; saveState(); render(); toast(t('cancelled'),'warn'); }
      function finishFocusEarly(){ const a=state.activeFocus; if(!a)return; logSession(a,'completed',Math.floor(activeElapsedMs()/1000)); state.activeFocus=null; saveState(); render(); toast(t('sessionLogged'),'success'); }
      function logSession(a,status,override=null){
        const actualSec=override!=null?Math.max(0,Math.round(override)):(status==='completed'?Math.min(a.plannedSec,Math.max(1,Math.floor(activeElapsedMs()/1000))):Math.floor(activeElapsedMs()/1000));
        state.sessions.unshift(normalizeSession({id:a.sessionId,taskId:a.taskId,subjectId:a.subjectId,mode:a.mode,startedAt:new Date(a.startedAt-a.accumulatedMs).toISOString(),endedAt:iso(),plannedSec:a.plannedSec,actualSec,status}));
        if(status==='completed' && a.mode==='focus'){ if(a.taskId){ const t=taskById(a.taskId); if(t){ t.actualMin+=Math.round(actualSec/60); t.updatedAt=iso(); } } Gamification.focusReward(actualSec); playSound(); vibrate(); }
        saveState(); Gamification.checkBadges();
      }
      function tickTimer(){ const a=state.activeFocus; if(!a){ clearInterval(timerInterval); timerInterval=null; return; } updateFocusUI(); if(!a.pausedAt && activeRemainingSec()<=0){ logSession(a,'completed',a.plannedSec); state.activeFocus=null; saveState(); render(); toast(t('sessionLogged'),'success'); } }
      function updateFocusUI(){ const a=state.activeFocus; if(!a)return; const rem=activeRemainingSec(); const txt=`${pad(Math.floor(rem/60))}:${pad(rem%60)}`; $$('[data-remaining]').forEach(n=>n.textContent=txt); $$('[data-focus-progress]').forEach(n=>n.style.width=clamp(100-(rem/a.plannedSec*100),0,100)+'%'); const p=$('[data-action="focus-pause"]'), r=$('[data-action="focus-resume"]'); if(p)p.classList.toggle('hidden',!!a.pausedAt); if(r)r.classList.toggle('hidden',!a.pausedAt); }
      function playSound(){ if(!state.settings.sound)return; try{ const Ctx=window.AudioContext||window.webkitAudioContext; const ctx=new Ctx(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.value=.08; o.start(); setTimeout(()=>{o.stop();ctx.close();},180); }catch{} }
      function vibrate(){ if(state.settings.vibration && navigator.vibrate) navigator.vibrate([80,40,80]); }
      function celebrate(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches)return; for(let i=0;i<24;i++){ const el=document.createElement('div'); el.className='confetti-piece'; el.style.left=Math.random()*100+'vw'; el.style.background=['#2563eb','#7c3aed','#059669','#d97706','#dc2626'][i%5]; el.style.animationDelay=(Math.random()*.25)+'s'; document.body.appendChild(el); setTimeout(()=>el.remove(),1500); } }

      /* =========================
         10) Notifications
         ========================= */
      function getAlerts(){ const now=Date.now(), lead=state.settings.notifyLead*60000, out=[]; state.tasks.filter(t=>t.status!=='done'&&t.dueAt).forEach(t=>{ const due=Date.parse(t.dueAt); if(due-now<=lead && due-now>-lead*2) out.push({type:'task',id:t.id,title:t.title,due:t.dueAt,overdue:due<now}); }); return out.sort((a,b)=>Date.parse(a.due)-Date.parse(b.due)); }
      function alertKey(a){ return `${a.type}-${a.id}-${a.due}`; }
      function unreadAlerts(){ return getAlerts().filter(a=>!state.notifications.seen[alertKey(a)]); }
      function checkNotifications(){ const alerts=unreadAlerts(); if(window.Notification?.permission==='granted'){ alerts.slice(0,3).forEach(a=>{ try{ new Notification(a.overdue?t('overdue'):t('notifications'),{body:a.title}); }catch{} state.notifications.seen[alertKey(a)]=true; }); saveState(false); } updateBell(); }
      function requestNotificationPermission(){ if(!('Notification' in window)){ toast(t('notificationExplanation'),'warn'); return; } Notification.requestPermission().then(p=>toast(p==='granted'?t('savedMsg'):t('notificationExplanation'),p==='granted'?'success':'warn')); }
      function updateBell(){ const b=$('#bellCount'); if(!b)return; const c=unreadAlerts().length; b.textContent=c>99?'99+':c; b.classList.toggle('hidden',c===0); }

      /* =========================
         11) UI Core
         ========================= */
      let modalStack=[];
      function toast(msg,type='info',action=null){ const root=$('#toastRoot'); const el=document.createElement('div'); el.className=`toast ${type}`; el.innerHTML=`<div style="flex:1">${esc(msg)}</div>`; if(action){ const btn=document.createElement('button'); btn.className='btn sm'; btn.textContent=action.label; btn.dataset.action=action.action; el.appendChild(btn); } root.appendChild(el); setTimeout(()=>{el.classList.add('hide'); setTimeout(()=>el.remove(),220);}, action?6000:3200); }
      function openModal(opts){ const backdrop=document.createElement('div'); backdrop.className='modal-backdrop'; const modal=document.createElement('div'); modal.className=`modal ${opts.size||''}`; modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); modal.innerHTML=`<div class="modal-head"><h3>${esc(opts.title||'')}</h3><button class="icon-btn" data-close aria-label="${esc(t('close'))}">${icon('close',18)}</button></div><div class="modal-body">${opts.body||''}</div>${opts.footer?`<div class="modal-foot">${opts.footer}</div>`:''}`; backdrop.appendChild(modal); $('#modalRoot').appendChild(backdrop); requestAnimationFrame(()=>backdrop.classList.add('show')); const api={el:modal,close(){backdrop.classList.remove('show');setTimeout(()=>backdrop.remove(),180);modalStack=modalStack.filter(m=>m!==api);}}; backdrop.addEventListener('mousedown',e=>{if(e.target===backdrop && opts.dismissible!==false)api.close();}); modal.querySelector('[data-close]').addEventListener('click',api.close); modalStack.push(api); setTimeout(()=>modal.querySelector('input,select,textarea,button')?.focus(),60); return api; }
      function confirmModal({title='',message='',confirmText='',danger=false}={}){ return new Promise(res=>{ const m=openModal({title,size:'sm',dismissible:false,body:`<p>${esc(message)}</p>`,footer:`<button class="btn ${danger?'danger':'primary'}" id="ok">${esc(confirmText||t('confirm'))}</button><button class="btn" id="cx">${esc(t('cancel'))}</button>`}); m.el.querySelector('#ok').onclick=()=>{m.close();res(true);}; m.el.querySelector('#cx').onclick=()=>{m.close();res(false);}; }); }
      function promptSafe(label,def=''){ return new Promise(res=>{ const m=openModal({title:label,size:'sm',dismissible:false,body:`<label class="field"><span>${esc(label)}</span><input class="input" id="pi" value="${esc(def)}"></label>`,footer:`<button class="btn primary" id="ok">${esc(t('save'))}</button><button class="btn" id="cx">${esc(t('cancel'))}</button>`}); m.el.querySelector('#ok').onclick=()=>{const v=m.el.querySelector('#pi').value.trim(); m.close(); res(v||null);}; m.el.querySelector('#cx').onclick=()=>{m.close();res(null);}; }); }
      function applySettings(){ const lang=state.settings.lang; document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr'; const dark=state.settings.themeMode==='dark'||(state.settings.themeMode==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme=dark?'dark':'light'; const preset=getPreset(state.settings.themePreset); document.documentElement.style.setProperty('--accent',state.settings.accent||preset.accent); const meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.content=state.settings.accent||preset.accent; }

      function avatarHtml(size=38){ const frame=state.game.frames.equipped||'none'; const photo=state.profile.photo||state.auth.photoURL; const name=state.profile.name||state.auth.displayName||'U'; return `<span class="avatar-wrap">${photo?`<img class="avatar frame-${esc(frame)}" style="width:${size}px;height:${size}px" src="${esc(photo)}" alt="">`:`<span class="avatar frame-${esc(frame)}" style="width:${size}px;height:${size}px;background:${esc(state.profile.avatarColor)}">${esc((name||'م').slice(0,1).toUpperCase())}</span>`}</span>`; }

      function statCard(title,value,sub,ic){ return `<div class="card"><div class="row between"><div><div class="muted small">${esc(title)}</div><div style="font-size:1.45rem;font-weight:900">${esc(value)}</div><div class="muted small">${esc(sub||'')}</div></div><div style="color:var(--accent)">${icon(ic,24)}</div></div></div>`; }

      function renderLogin(){
        const has=hasFirebaseConfig(); const profiles=getProfiles();

          <div class="auth-hero"><div class="logo" data-secret>${logo(44)}</div><div><h1 style="margin:0">${esc(t('appName'))} <span class="ys-badge">${esc(t('ultra'))}</span></h1><p class="muted" style="margin:4px 0 0">${esc(t('tagline'))}</p></div></div>
          <div class="row center" style="justify-content:center"><button class="chip ${state.settings.lang==='ar'?'active':''}" data-action="lang" data-lang="ar">${esc(t('arabic'))}</button><button class="chip ${state.settings.lang==='en'?'active':''}" data-action="lang" data-lang="en">${esc(t('english'))}</button></div>
          ${!has?`<div class="card small muted">${esc(t('firebaseMissing'))}</div>`:''}
          <div class="auth-tabs"><button class="tab-btn active" data-tab="google">${esc(t('google'))}</button><button class="tab-btn" data-tab="email">${esc(t('email'))}</button><button class="tab-btn" data-tab="guest">${esc(t('guest'))}</button></div>

          <div id="p-email" class="panel"><form id="emailLoginForm" class="auth-form"><label class="field"><span>Email</span><input class="input" type="email" name="email" required dir="ltr"></label><label class="field"><span>Password</span><input class="input" type="password" name="password" required minlength="6"></label><button class="btn primary" type="submit" ${has?'':'disabled'}>${esc(t('login'))}</button></form><details><summary class="link-btn">${esc(t('addProfile'))}</summary><form id="registerForm" class="auth-form" style="margin-top:10px"><label class="field"><span>${esc(t('displayName'))}</span><input class="input" name="name" required></label><label class="field"><span>Email</span><input class="input" type="email" name="email" required dir="ltr"></label><label class="field"><span>Password</span><input class="input" type="password" name="password" required minlength="6"></label><button class="btn primary" type="submit" ${has?'':'disabled'}>${esc(t('save'))}</button></form></details><details><summary class="link-btn">${esc(t('invalidCredentials'))}</summary><form id="resetForm" class="auth-form" style="margin-top:10px"><label class="field"><span>Email</span><input class="input" type="email" name="email" required dir="ltr"></label><button class="btn" type="submit" ${has?'':'disabled'}>${esc(t('send'))}</button></form></details></div>
          <div id="p-guest" class="panel"><button class="btn" data-action="guest-login" style="width:100%">${esc(t('guest'))}</button></div>
          ${profiles.length?`<div><div class="row between"><strong>${esc(t('savedProfiles'))}</strong><button class="link-btn" data-action="new-local-profile">${icon('plus',14)} ${esc(t('addProfile'))}</button></div><div class="profile-list">${profiles.map(p=>`<div class="profile-row"><div class="avatar" style="background:${esc(p.color)}">${p.photo||p.photoURL?`<img src="${esc(p.photo||p.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc((p.name||'م').slice(0,1).toUpperCase())}</div><div class="meta"><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.email||(p.provider==='local'?t('localOnly'):t('synced')))}</div></div><button class="btn sm" data-action="open-profile" data-id="${p.id}">${esc(t('openProfile'))}</button><button class="icon-btn" data-action="delete-profile" data-id="${p.id}" aria-label="${esc(t('deleteProfile'))}">${icon('trash',16)}</button></div>`).join('')}</div></div>`:''}
          <div class="muted small center"><span class="ys-signature">YS</span> • ${esc(APP.copyright)}</div>
        </div></div>`;
      }

      function renderShell(){
        const v=state.ui.view;
        return `<div class="shell"><aside class="sidebar ${state.ui.sidebarOpen?'open':''}"><div class="brand"><div class="brand-logo" data-secret>${logo(24)}</div><div><strong>${esc(t('appName'))}</strong><div class="muted small">v${esc(APP.version)}</div></div></div><nav class="nav">${navItems().map(([x,k])=>`<button class="nav-item ${v===x?'active':''}" data-action="nav" data-view="${x}">${icon(k,20)}<span>${esc(t(x))}</span></button>`).join('')}</nav><div class="sidebar-footer"><span class="ys-signature">YS</span> ${esc(APP.copyright)}</div></aside><div class="overlay ${state.ui.sidebarOpen?'show':''}" data-action="close-sidebar"></div><main class="main"><header class="topbar"><button class="icon-btn" data-action="toggle-sidebar">${icon('menu',20)}</button><div class="top-title"><h1>${esc(t(v))}</h1><p class="muted">${esc(state.profile.name||t('appName'))}</p></div>${syncPill()}<button class="icon-btn" data-action="alerts" style="position:relative">${icon('bell',20)}<span id="bellCount" class="badge hidden" style="position:absolute;top:2px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 4px;background:var(--danger);color:#fff;border:0"></span></button><button class="icon-btn" data-action="nav" data-view="settings">${avatarHtml(30)}</button></header><section class="view">${renderView(v)}</section></main><nav class="bottom-nav">${bottomItems().map(x=>{const item=navItems().find(n=>n[0]===x); return `<button class="nav-item ${v===x?'active':''}" data-action="nav" data-view="${x}">${icon(item?item[1]:'star',18)}<span>${esc(t(x))}</span></button>`;}).join('')}</nav></div>`;
      }

      function renderView(v){
        if(v==='home') return renderHome();
        if(v==='tasks') return renderTasks();
        if(v==='groups') return renderGroups();
        if(v==='teams') return renderTeams();
        if(v==='leaderboard') return renderLeaderboard();
        if(v==='challenges') return renderChallenges();
        if(v==='focus') return renderFocus();
        if(v==='settings') return renderSettings();
        if(v==='developer') return renderDeveloper();
        return renderHome();
      }

      function taskRow(x){
        const s=subjectById(x.subjectId), g=groupById(x.groupId), tm=teamById(x.teamId), done=x.status==='done', od=isOverdue(x);
        return `<div class="list-item ${done?'done':''}"><input type="checkbox" ${done?'checked':''} data-action="toggle-task" data-id="${x.id}" style="width:22px;height:22px;min-height:auto"><div class="list-main"><div class="list-title">${esc(x.title)}</div><div class="meta"><span class="badge ${x.priority}">${esc(t(x.priority))}</span><span><span class="dot" style="background:${esc(s?.color||'var(--muted)')}"></span> ${esc(s?.name||t('noSubject'))}</span>${g?`<span>${esc(g.name)}</span>`:''}${tm?`<span>${esc(tm.name)}</span>`:''}<span style="${od?'color:var(--danger);font-weight:900':''}">${esc(x.dueAt?new Date(x.dueAt).toLocaleString():'—')}</span><span>${esc(fmtDuration(x.estimate))}</span>${x.subtasks.length?`<span>${x.subtasks.filter(y=>y.done).length}/${x.subtasks.length}</span>`:''}</div>${x.subtasks.length?`<div class="progress"><span style="width:${x.progress}%"></span></div>`:''}</div><div class="row"><button class="icon-btn" data-action="focus-task" data-id="${x.id}">${icon('play',16)}</button><button class="icon-btn" data-action="edit-task" data-id="${x.id}">${icon('edit',16)}</button><button class="icon-btn" data-action="delete-task" data-id="${x.id}">${icon('trash',16)}</button></div></div>`;
      }

      function renderHome(){
        const todays=state.tasks.filter(x=>x.status!=='done'&&x.dueAt&&sameDay(parseDate(x.dueAt),new Date()));
        const overdue=state.tasks.filter(isOverdue).length;
        const nearest=[...state.challenges.cloud,...state.challenges.local].filter(c=>new Date(c.endsAt)>=new Date()).sort((a,b)=>new Date(a.endsAt)-new Date(b.endsAt))[0];
        return `<div class="grid stats">${statCard(t('today'),todays.length,`${overdue} ${t('overdue')}`,'tasks')}${statCard(t('xp'),state.game.xp,`${t('level')} ${state.game.level}`,'star')}${statCard(t('streak'),state.game.streak,`${t('bestStreak')}: ${state.game.bestStreak}`,'fire')}${statCard(t('focus'),fmtDuration(focusMinutesOn(new Date())),t('todaySessions'),'focus')}</div>
        <div class="card" style="margin-top:12px"><h2 class="title">${esc(t('quickAdd'))}</h2><form id="quickAddForm" class="row" style="margin-top:10px"><input class="input" name="text" placeholder="${esc(t('quickAdd'))}" required><button class="btn primary" type="submit">${icon('plus',18)} ${esc(t('add'))}</button></form></div>
        <div class="grid cols-2" style="margin-top:12px"><div class="card"><div class="row between"><h2 class="title">${esc(t('today'))}</h2><button class="btn sm" data-action="nav" data-view="tasks">${esc(t('all'))}</button></div><div class="list">${todays.length?todays.slice(0,5).map(taskRow).join(''):emptyHtml(t('noTasks'))}</div></div><div class="card"><h2 class="title">${esc(t('nearestChallenge'))}</h2>${nearest?`<div style="font-weight:900">${esc(nearest.title)}</div><div class="muted small">${esc(fmtDateTime(nearest.endsAt))} • +${nearest.rewardXp} XP</div>`:emptyHtml(t('noChallenges'))}<div class="kv" style="margin-top:10px"><span>${esc(t('activeTeam'))}</span><strong>${esc(state.activeTeamId?teamById(state.activeTeamId)?.name||'—':t('noActiveTeam'))}</strong></div><div class="row" style="margin-top:10px"><button class="btn primary sm" data-action="nav" data-view="focus">${esc(t('startFocus'))}</button><button class="btn sm" data-action="nav" data-view="leaderboard">${esc(t('leaderboard'))}</button></div></div></div>`;
      }

      function filteredTasks(){
        const q=state.ui.taskSearch.trim().toLowerCase(), now=new Date(), f=state.ui.taskFilter;
        let list=state.tasks.filter(x=>{
          if(q && !`${x.title} ${x.description} ${x.notes} ${x.tags.join(' ')}`.toLowerCase().includes(q)) return false;
          if(state.ui.groupFilter!=='all' && x.groupId!==state.ui.groupFilter) return false;
          if(state.ui.teamFilter!=='all' && x.teamId!==state.ui.teamFilter) return false;
          if(f==='today') return x.status!=='done'&&x.dueAt&&sameDay(parseDate(x.dueAt),now);
          if(f==='upcoming') return x.status!=='done'&&x.dueAt&&parseDate(x.dueAt)>=now;
          if(f==='overdue') return isOverdue(x);
          if(f==='done') return x.status==='done';
          return true;
        });
        const pw={high:3,medium:2,low:1};
        list.sort((a,b)=>{
          if(state.ui.taskSort==='due') return (parseDate(a.dueAt)?.getTime()||Infinity)-(parseDate(b.dueAt)?.getTime()||Infinity);
          if(state.ui.taskSort==='priority') return pw[b.priority]-pw[a.priority];
          if(state.ui.taskSort==='created') return new Date(b.createdAt)-new Date(a.createdAt);
          return a.title.localeCompare(b.title);
        });
        return list;
      }
      function renderTasksContent(){
        const list=filteredTasks();
        if(state.ui.taskView==='kanban') return `<div class="kanban">${STATUS.map(st=>`<div class="kanban-col" data-status="${st}"><div class="row between"><strong>${esc(t(st))}</strong><span class="badge">${list.filter(x=>x.status===st).length}</span></div>${list.filter(x=>x.status===st).map(x=>`<div class="kanban-card" draggable="true" data-id="${x.id}"><div class="list-title">${esc(x.title)}</div><div class="meta"><span class="badge ${x.priority}">${esc(t(x.priority))}</span></div></div>`).join('')||emptyHtml(t('noTasks'))}</div>`).join('')}</div>`;
        return `<div class="list">${list.length?list.map(taskRow).join(''):emptyHtml(t('noTasks'))}</div>`;
      }
      function renderTasks(){
        return `<div class="card"><div class="toolbar"><input id="taskSearch" class="input" placeholder="${esc(t('search'))}" value="${esc(state.ui.taskSearch)}"><select id="taskSort" class="input" style="max-width:160px"><option value="due" ${state.ui.taskSort==='due'?'selected':''}>${esc(t('sortDue'))}</option><option value="priority" ${state.ui.taskSort==='priority'?'selected':''}>${esc(t('sortPriority'))}</option><option value="created" ${state.ui.taskSort==='created'?'selected':''}>${esc(t('sortCreated'))}</option><option value="title" ${state.ui.taskSort==='title'?'selected':''}>${esc(t('sortTitle'))}</option></select><select class="input" style="max-width:160px" data-action="group-filter"><option value="all">${esc(t('all'))} ${esc(t('groups'))}</option>${state.groups.map(g=>`<option value="${g.id}" ${state.ui.groupFilter===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><select class="input" style="max-width:160px" data-action="team-filter"><option value="all">${esc(t('all'))} ${esc(t('teams'))}</option>${state.teams.map(g=>`<option value="${g.id}" ${state.ui.teamFilter===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><button class="btn" data-action="toggle-view">${esc(state.ui.taskView==='list'?t('kanban'):t('list'))}</button><button class="btn primary" data-action="new-task">${icon('plus',18)} ${esc(t('addTask'))}</button></div><div class="row" style="margin-bottom:10px">${['today','upcoming','overdue','done','all'].map(f=>`<button class="chip ${state.ui.taskFilter===f?'active':''}" data-action="task-filter" data-filter="${f}">${esc(t(f))}</button>`).join('')}</div><div id="tasksContent">${renderTasksContent()}</div></div>`;
      }

      function renderGroups(){
        return `<div class="card"><div class="row between"><h2 class="title">${esc(t('groups'))}</h2><button class="btn primary" data-action="new-group">${icon('plus',18)} ${esc(t('addGroup'))}</button></div>${state.groups.length?`<div class="grid-cards" style="margin-top:12px">${state.groups.map(g=>{const tasks=state.tasks.filter(x=>x.groupId===g.id); return `<div class="card entity-card"><div class="strip" style="background:${esc(g.color)}"></div><div style="margin-top:6px"><h3 style="margin:0">${esc(g.name)}</h3><div class="muted small">${esc(g.description||'—')}</div></div><div class="mini-stats"><div class="mini-stat"><strong>${tasks.length}</strong><div class="muted small">${esc(t('tasks'))}</div></div><div class="mini-stat"><strong>${tasks.filter(x=>x.status==='done').length}</strong><div class="muted small">${esc(t('done'))}</div></div></div><div class="row"><button class="btn sm" data-action="edit-group" data-id="${g.id}">${esc(t('edit'))}</button><button class="btn sm danger" data-action="delete-group" data-id="${g.id}">${esc(t('delete'))}</button></div></div>`;}).join('')}</div>`:emptyHtml(t('noGroups'))}</div>`;
      }

      function renderTeams(){
        const active=teamById(state.activeTeamId);
        return `<div class="card"><div class="row between"><div><h2 class="title">${esc(t('teams'))}</h2><p class="subtitle">${esc(t('createFirstTeam'))}</p></div><div class="row"><button class="btn" data-action="join-team">${icon('users',16)} ${esc(t('joinTeam'))}</button><button class="btn primary" data-action="new-team">${icon('plus',18)} ${esc(t('createTeam'))}</button></div></div>
        ${state.teams.length?`<div class="grid-cards" style="margin-top:12px">${state.teams.map(tm=>{const tasks=state.tasks.filter(x=>x.teamId===tm.id); return `<div class="card entity-card ${state.activeTeamId===tm.id?'active':''}"><div class="strip" style="background:${esc(tm.color)}"></div><div style="margin-top:6px"><h3 style="margin:0">${esc(tm.name)}</h3><div class="muted small">${esc(tm.description||'—')}</div><div class="badge" style="margin-top:6px">${esc(t('teamCode'))}: ${esc(tm.joinCode)}</div></div><div class="mini-stats"><div class="mini-stat"><strong>${tasks.length}</strong><div class="muted small">${esc(t('tasks'))}</div></div><div class="mini-stat"><strong>${tm.memberIds.length}</strong><div class="muted small">${esc(t('members'))}</div></div></div><div class="row"><button class="btn sm ${state.activeTeamId===tm.id?'primary':''}" data-action="select-team" data-id="${tm.id}">${esc(state.activeTeamId===tm.id?t('activeTeam'):t('selectTeam'))}</button><button class="btn sm" data-action="copy-team-code" data-id="${tm.id}">${esc(t('copyCode'))}</button><button class="btn sm danger" data-action="leave-team" data-id="${tm.id}">${esc(t('leaveTeam'))}</button></div></div>`;}).join('')}</div>`:emptyHtml(t('noTeams'))}
        </div>
        ${active?`<div class="card" style="margin-top:12px"><div class="row between"><h2 class="title">${esc(t('teamLb'))}: ${esc(active.name)}</h2><button class="btn sm primary" data-action="lb-tab" data-tab="team">${esc(t('refresh'))}</button></div><div class="list">${state.leaderboard.cache.filter(Boolean).slice(0,10).map(lbRow).join('')||emptyHtml(t('noData'))}</div></div>`:''}`;
      }

      function lbRow(r,i=0){ return `<div class="list-item"><div class="lb-rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}" style="min-width:28px">${i+1}</div>${r.photo?`<img class="avatar frame-${esc(r.frame||'none')}" src="${esc(r.photo)}" style="width:34px;height:34px" alt="">`:`<span class="avatar frame-${esc(r.frame||'none')}" style="width:34px;height:34px;background:${esc(r.avatarColor||'var(--accent)')}">${esc((r.displayName||'م').slice(0,1).toUpperCase())}</span>`}<div class="list-main"><div class="list-title">${esc(r.displayName||'—')}</div><div class="meta"><span>${esc(r.title||t('student'))}</span><span>${esc(t('level'))} ${esc(r.level||1)}</span><span>${esc(r.xp||0)} XP</span><span>${esc(r.streak||0)} ${esc(t('streak'))}</span></div></div></div>`; }

      function renderLeaderboard(){
        const tab=state.ui.leaderboardTab||'global'; const rows=state.leaderboard.cache||[];
        return `<div class="card"><div class="row between"><div><h2 class="title">${esc(t('leaderboard'))}</h2><p class="subtitle">${esc(fb.ready?t('synced'):t('localOnly'))}</p></div><div class="segmented">${['global','daily','team'].map(x=>`<button class="${tab===x?'active':''}" data-action="lb-tab" data-tab="${x}">${esc(t(x==='global'?'global':x==='daily'?'daily':'teamLb'))}</button>`).join('')}</div></div><div class="row" style="margin:10px 0"><button class="btn primary" data-action="lb-refresh">${icon('zap',16)} ${esc(t('refresh'))}</button><span class="muted small">${state.leaderboard.updatedAt?esc(fmtDateTime(state.leaderboard.updatedAt)):''}</span></div><div class="list">${rows.length?rows.map((r,i)=>lbRow(r,i)).join(''):emptyHtml(t('noData'))}</div></div>
        <div class="grid cols-2" style="margin-top:12px"><div class="card"><h2 class="title">${esc(t('heatMap'))}</h2>${renderHeatMap()}</div><div class="card"><h2 class="title">${esc(t('frames'))}</h2><div class="frame-grid">${FRAME_DEFS.map(f=>{const un=state.game.frames.unlocked.includes(f.id), eq=state.game.frames.equipped===f.id; return `<div class="frame-item ${un?'':'locked'} ${eq?'equipped':''}"><span class="avatar frame-${esc(f.id)}" style="width:52px;height:52px;background:var(--accent)">${icon('user',22)}</span><strong>${esc(frameName(f.id))}</strong><div class="muted small">${esc(un?(eq?t('equipped'):t('unlocked')):t('locked'))}</div>${un?`<button class="btn sm ${eq?'primary':''}" data-action="equip-frame" data-id="${f.id}">${esc(eq?t('equipped'):t('equip'))}</button>`:''}</div>`;}).join('')}</div></div></div>
        <div class="card" style="margin-top:12px"><h2 class="title">${esc(t('titles'))}</h2><div class="row">${TITLE_DEFS.map(x=>{const un=state.game.titles.unlocked.includes(x.id), eq=state.game.titles.equipped===x.id; return `<button class="chip ${eq?'active':''}" data-action="equip-title" data-id="${x.id}" ${un?'':'disabled'}>${esc(titleName(x.id))}</button>`;}).join('')}</div></div>
        <div class="card" style="margin-top:12px"><h2 class="title">${esc(t('badges'))}</h2><div class="badge-grid">${BADGE_DEFS.map(b=>{const un=!!state.game.badges[b.id]; return `<div class="badge-item ${un?'unlocked':''}"><div class="badge-icon">${icon(b.icon||'star',22)}</div><strong>${esc(badgeName(b.id))}</strong><div class="muted small">+${b.xp} XP</div></div>`;}).join('')}</div></div>`;
      }
      function renderHeatMap(){ const days=Array.from({length:35},(_,i)=>dateKey(addDays(new Date(),i-34))); const set=new Set(state.game.studyDates); return `<div class="heat-grid">${days.map(k=>`<div class="heat-cell ${set.has(k)?'on':''}" title="${esc(k)}"></div>`).join('')}</div><div class="row" style="margin-top:8px"><span class="muted small">${esc(t('streak'))}: <strong>${state.game.streak}</strong></span><span class="muted small">${esc(t('bestStreak'))}: <strong>${state.game.bestStreak}</strong></span></div>`; }

      function renderChallenges(){
        const all=[...state.challenges.cloud.map(c=>({...c,source:'cloud'})),...state.challenges.local.map(c=>({...c,source:'local'}))].filter(c=>new Date(c.endsAt)>=new Date());
        return `<div class="card"><div class="row between"><h2 class="title">${esc(t('challenges'))}</h2><div class="row"><button class="btn" data-action="refresh-challenges">${icon('zap',16)} ${esc(t('refresh'))}</button><button class="btn primary" data-action="new-challenge">${icon('plus',18)} ${esc(t('addChallenge'))}</button></div></div>${all.length?`<div class="grid cols-2" style="margin-top:12px">${all.map(c=>`<div class="card challenge-card ${c.type}"><div class="row between"><strong>${esc(c.title)}</strong><span class="badge ${c.source==='cloud'?'done':'new'}">${esc(c.source==='cloud'?t('synced'):t('localOnly'))}</span></div><div class="muted small">${esc(c.description||'—')}</div><div class="meta"><span>${esc(t(c.type==='race'?'race':c.type==='focus'?'focusChallenge':c.type==='streak'?'streakChallenge':'teamChallenge'))}</span><span>${esc(t('endsAt'))}: ${esc(fmtDateTime(c.endsAt))}</span><span>+${c.rewardXp} XP</span><span>${(c.participants||[]).length} ${esc(t('users'))}</span></div><div class="row"><button class="btn sm primary" data-action="join-challenge" data-id="${c.id}" data-source="${c.source}">${esc(t('joinChallenge'))}</button><button class="btn sm" data-action="submit-challenge" data-id="${c.id}" data-source="${c.source}">${esc(t('submitChallenge'))}</button></div></div>`).join('')}</div>`:emptyHtml(t('noChallenges'))}</div>`;
      }

      function parseQuickAdd(text){
        let title=text.trim(); const res={title,tags:[],priority:'medium',dueAt:null,estimate:25,subjectId:null,groupId:null,teamId:state.activeTeamId||null};
        title=title.replace(/#(\S+)/g,(m,w)=>{res.tags.push(w);return '';});
        if(/!(high|عالية|عاجل)/i.test(title)){res.priority='high'; title=title.replace(/!(high|عالية|عاجل)/gi,'');}
        state.subjects.forEach(s=>{ if(title.includes(s.name)){res.subjectId=s.id; title=title.replace(s.name,' ');}});
        const now=new Date(); let d=new Date(); let hasDate=false;
        if(/بكرة|غدًا|غدا|tomorrow/i.test(title)){d=addDays(now,1);hasDate=true;title=title.replace(/بكرة|غدًا|غدا|tomorrow/gi,'');}
        const tm=title.match(/([01]?\d|2[0-3])[:\s\.]?([0-5]\d)?\s*(ص|م|am|pm)?/i);
        if(tm){let h=Number(tm[1]); const m=Number(tm[2]||0); const mer=(tm[3]||'').toLowerCase(); if(['م','pm'].includes(mer)&&h<12)h+=12; if(['ص','am'].includes(mer)&&h===12)h=0; d.setHours(h,m,0,0); if(!hasDate&&d<now)d=addDays(d,1); res.dueAt=d.toISOString(); title=title.replace(tm[0],'');}
        else if(hasDate){d.setHours(20,0,0,0);res.dueAt=d.toISOString();}
        const est=title.match(/(\d+)\s*(د|دقيقة|min)/i); if(est){res.estimate=Number(est[1]); title=title.replace(est[0],'');}
        res.title=title.replace(/\s+/g,' ').trim()||text.trim(); return res;
      }

      function saveTaskForm(form){
        const fd=new FormData(form); const title=String(fd.get('title')||'').trim(); if(!title){toast(t('requiredTitle'),'error');return false;}
        const due=fd.get('dueAt'); const dueDate=due?parseDate(due):null; if(due&&!dueDate){toast(t('invalidDate'),'error');return false;}
        const subtasks=$$('.subtask-row',form).map(r=>({id:r.dataset.id||uid(),title:r.querySelector('[name=subtaskTitle]').value.trim(),done:r.querySelector('input[type=checkbox]').checked})).filter(x=>x.title);
        const data={id:form.dataset.id||uid(),title,description:fd.get('description'),subjectId:fd.get('subjectId')||null,groupId:fd.get('groupId')||null,teamId:fd.get('teamId')||null,priority:fd.get('priority'),status:fd.get('status'),dueAt:dueDate?dueDate.toISOString():null,estimate:Math.max(0,num(fd.get('estimate'),25)),subtasks};
        if(form.dataset.id) Tasks.update(form.dataset.id,data); else Tasks.create(data);
        toast(t('savedMsg'),'success'); return true;
      }

      function exportCSV(){ const rows=[['id','title','subject','group','team','priority','status','dueAt','estimate']]; state.tasks.forEach(x=>rows.push([x.id,x.title,subjectById(x.subjectId)?.name||'',groupById(x.groupId)?.name||'',teamById(x.teamId)?.name||'',x.priority,x.status,x.dueAt||'',x.estimate])); download(`munjiz-tasks.csv`,toCSV(rows),'text/csv'); toast(t('exported'),'success'); }
      function importJSON(){ const i=document.createElement('input'); i.type='file'; i.accept='application/json,.json'; i.onchange=async()=>{ const f=i.files?.[0]; if(!f)return; const r=new FileReader(); r.onload=async()=>{ try{ const obj=JSON.parse(r.result); if(!obj||!Array.isArray(obj.tasks)) throw 0; if(!await confirmModal({title:t('importJson'),message:t('deleteAllWarning'),danger:true})) return; state=normalizeState(obj); if(activeProfile) saveProfile(activeProfile.id,state); applySettings(); render(); toast(t('imported'),'success'); }catch{ toast(t('importFailed'),'error'); } }; r.readAsText(f); }; i.click(); }
      async function deleteAll(){ if(!await confirmModal({title:t('deleteAll'),message:t('deleteAllWarning'),danger:true})) return; const word=state.settings.lang==='ar'?'حذف':'delete'; const m=openModal({title:t('doubleConfirm'),size:'sm',dismissible:false,body:`<p>${esc(t('deleteAllWarning'))}</p><label class="field"><span>${esc(word)}</span><input class="input" id="kw"></label>`,footer:`<button class="btn danger" id="ok">${esc(t('confirm'))}</button><button class="btn" id="cx">${esc(t('cancel'))}</button>`}); m.el.querySelector('#ok').onclick=()=>{ if(m.el.querySelector('#kw').value.trim().toLowerCase()!==word){toast(t('invalidDate'),'error');return;} if(activeProfile) localStorage.removeItem(profileKey(activeProfile.id)); const list=getProfiles().filter(p=>p.id!==activeProfile?.id); saveProfiles(list); localStorage.removeItem(LS.active); activeProfile=null; state=normalizeState({settings:state.settings}); window.__state=state; m.close(); render(); toast(t('deleted'),'success'); }; m.el.querySelector('#cx').onclick=()=>m.close(); }
      function handlePhotoFile(file){ if(!file||!file.type.startsWith('image/')) return; const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ const size=256; const c=document.createElement('canvas'); c.width=size; c.height=size; const ctx=c.getContext('2d'); const min=Math.min(img.width,img.height); ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,size,size); state.profile.photo=c.toDataURL('image/jpeg',0.82); URL.revokeObjectURL(url); if(activeProfile){ activeProfile.photo=state.profile.photo; const list=getProfiles(); const i=list.findIndex(p=>p.id===activeProfile.id); if(i>=0){list[i]=activeProfile; saveProfiles(list);} } saveState(); render(); toast(t('savedMsg'),'success'); }; img.src=url; }
      async function sendInquiry(subject,message){ if(!fb.ready || state.auth.provider!=='firebase'){ toast(t('requiresFirebase'),'warn'); return; } try{ await fb.db.collection('inquiries').add({uid:state.auth.uid,name:state.profile.name||state.auth.displayName||'User',subject,message,createdAt:iso(),status:'open',developerReply:''}); toast(t('inquirySent'),'success'); }catch{ toast(t('requiresFirebase'),'error'); } }

      /* =========================
         15) Events
         ========================= */
      let logoTaps=0, logoTimer=null;
      document.addEventListener('click', async e => {
        const tab=e.target.closest('[data-tab]');
        if(tab){ $$('.tab-btn').forEach(b=>b.classList.toggle('active',b===tab)); $$('.panel').forEach(p=>p.classList.remove('active')); $(`#p-${tab.dataset.tab}`)?.classList.add('active'); return; }
        const secret=e.target.closest('[data-secret]');
        if(secret){ logoTaps++; clearTimeout(logoTimer); logoTimer=setTimeout(()=>logoTaps=0,700); if(logoTaps>=3){logoTaps=0; openDeveloperAccessModal();} return; }
        const el=e.target.closest('[data-action]'); if(!el) return;
        const a=el.dataset.action, id=el.dataset.id;
        switch(a){
          case 'lang': state.settings.lang=el.dataset.lang; saveState(); render(); break;
          case 'google-login': await signInWithGoogle($('#remember')?.checked ?? true); break;
          case 'guest-login': { const name=await promptSafe(t('displayName'), state.settings.lang==='ar'?'ضيف':'Guest'); if(!name) break; const p=createProfile({name,provider:'local'}); switchProfile(p.id); break; }
          case 'new-local-profile': { const name=await promptSafe(t('displayName'), state.settings.lang==='ar'?'ملف جديد':'New profile'); if(!name) break; const p=createProfile({name,provider:'local'}); switchProfile(p.id); break; }
          case 'open-profile': switchProfile(id); break;
          case 'delete-profile': if(await confirmModal({title:t('deleteProfile'),message:t('deleteAllWarning'),danger:true})) deleteProfile(id); break;
          case 'toggle-sidebar': state.ui.sidebarOpen=!state.ui.sidebarOpen; render(); break;
          case 'close-sidebar': state.ui.sidebarOpen=false; render(); break;
          case 'nav': state.ui.view=el.dataset.view; state.ui.sidebarOpen=false; saveState(false); render(); if(state.ui.view==='leaderboard') Leaderboard.fetch(state.ui.leaderboardTab||'global'); break;
          case 'alerts': openAlertsModal(); break;
          case 'mark-alerts': getAlerts().forEach(x=>state.notifications.seen[alertKey(x)]=true); saveState(); updateBell(); modalStack.at(-1)?.close(); break;
          case 'open-task': openTaskModal(id); modalStack.at(-1)?.close(); break;
          case 'new-task': openTaskModal(); break;
          case 'edit-task': openTaskModal(id); break;
          case 'delete-task': if(await confirmModal({title:t('delete'),message:t('delete'),danger:true})) Tasks.remove(id); break;
          case 'delete-task-from-modal': if(await confirmModal({title:t('delete'),message:t('delete'),danger:true})){ Tasks.remove(id); modalStack.at(-1)?.close(); } break;
          case 'save-task': if(saveTaskForm($('#taskForm'))) modalStack.at(-1)?.close(); break;
          case 'add-subtask': $('#subtasks').insertAdjacentHTML('beforeend',`<div class="subtask-row" data-id="${uid()}"><input type="checkbox"><input class="input" name="subtaskTitle"><button type="button" class="icon-btn" data-action="remove-subtask">${icon('trash',15)}</button></div>`); break;
          case 'remove-subtask': el.closest('.subtask-row').remove(); break;
          case 'toggle-task': Tasks.toggle(id); break;
          case 'focus-task': state.ui.view='focus'; saveState(false); render(); startFocus({taskId:id}); break;
          case 'task-filter': state.ui.taskFilter=el.dataset.filter; saveState(false); $('#tasksContent').innerHTML=renderTasksContent(); render(); break;
          case 'toggle-view': state.ui.taskView=state.ui.taskView==='list'?'kanban':'list'; saveState(false); render(); break;
          case 'undo': undoFn?.(); undoFn=null; break;
          case 'new-subject': openSubjectModal(); break;
          case 'edit-subject': openSubjectModal(id); break;
          case 'delete-subject': if(await confirmModal({title:t('delete'),message:t('delete'),danger:true})) Subjects.remove(id); break;
          case 'save-subject': { const f=$('#subjectForm'); const fd=new FormData(f); if(!String(fd.get('name')||'').trim()){toast(t('requiredTitle'),'error');break;} Subjects.upsert({id:f.dataset.id||uid(),name:fd.get('name'),color:fd.get('color'),description:fd.get('description')}); modalStack.at(-1)?.close(); render(); toast(t('savedMsg'),'success'); break; }
          case 'new-group': openGroupModal(); break;
          case 'edit-group': openGroupModal(id); break;
          case 'save-group': { const f=$('#groupForm'); const fd=new FormData(f); if(!String(fd.get('name')||'').trim()){toast(t('requiredTitle'),'error');break;} Groups.upsert({id:f.dataset.id||uid(),name:fd.get('name'),color:fd.get('color'),description:fd.get('description')}); modalStack.at(-1)?.close(); render(); toast(t('savedMsg'),'success'); break; }
          case 'delete-group': if(await confirmModal({title:t('delete'),message:t('delete'),danger:true})) Groups.remove(id); break;
          case 'new-team': openTeamModal(); break;
          case 'save-team': { const fd=new FormData($('#teamForm')); if(!String(fd.get('name')||'').trim()){toast(t('requiredTitle'),'error');break;} await Teams.create({name:fd.get('name'),color:fd.get('color'),description:fd.get('description')}); modalStack.at(-1)?.close(); render(); break; }
          case 'join-team': openJoinTeamModal(); break;
          case 'save-join-team': { const fd=new FormData($('#joinTeamForm')); const ok=await Teams.joinByCode(fd.get('code')); if(ok) modalStack.at(-1)?.close(); render(); break; }
          case 'select-team': Teams.setActive(id); break;
          case 'copy-team-code': { const tm=teamById(id); if(tm){ await navigator.clipboard?.writeText(tm.joinCode); toast(t('copied'),'success'); } break; }
          case 'leave-team': if(await confirmModal({title:t('leaveTeam'),message:t('leaveTeam'),danger:true})) await Teams.leave(id); render(); break;
          case 'lb-tab': Leaderboard.fetch(el.dataset.tab); break;
          case 'lb-refresh': Leaderboard.fetch(state.ui.leaderboardTab||'global'); break;
          case 'equip-frame': Gamification.equipFrame(el.dataset.id); break;
          case 'equip-title': Gamification.equipTitle(el.dataset.id); break;
          case 'new-challenge': openChallengeModal(); break;
          case 'save-challenge': { const fd=new FormData($('#challengeForm')); if(!String(fd.get('title')||'').trim()){toast(t('requiredTitle'),'error');break;} await Challenges.create({title:fd.get('title'),description:fd.get('description'),type:fd.get('type'),goal:num(fd.get('goal'),1),rewardXp:num(fd.get('rewardXp'),100),endsAt:parseDate(fd.get('endsAt'))?.toISOString()||new Date(Date.now()+3*DAY).toISOString(),teamId:state.activeTeamId||null}); modalStack.at(-1)?.close(); render(); break; }
          case 'refresh-challenges': await Challenges.fetchCloud(); render(); break;
          case 'join-challenge': await Challenges.join(id, el.dataset.source); render(); break;
          case 'submit-challenge': await Challenges.submit(id, el.dataset.source); render(); break;
          case 'focus-preset': { const i=$('#focusForm [name=minutes]'); if(i)i.value=el.dataset.min; break; }
          case 'focus-pause': pauseFocus(); break;
          case 'focus-resume': resumeFocus(); break;
          case 'focus-stop': if(await confirmModal({title:t('stop'),message:t('cancelled'),danger:true})) stopFocus(); break;
          case 'focus-finish': if(await confirmModal({title:t('complete'),message:t('sessionLogged')})) finishFocusEarly(); break;
          case 'deep-focus': document.body.classList.toggle('deep-focus'); break;
          case 'remove-photo': state.profile.photo=''; if(activeProfile){activeProfile.photo=''; const list=getProfiles(); const i=list.findIndex(p=>p.id===activeProfile.id); if(i>=0){list[i]=activeProfile;saveProfiles(list);}} saveState(); render(); break;
          case 'logout': await logout(); break;
          case 'request-notifications': requestNotificationPermission(); break;
          case 'export-json': exportJSON(); break;
          case 'import-json': importJSON(); break;
          case 'export-csv': exportCSV(); break;
          case 'delete-all': await deleteAll(); break;
          case 'dev-login': { const fd=new FormData($('#devLoginForm')); const ok=await loginWithEmail(fd.get('email'),fd.get('password'),true); if(ok){ const isDev=await Developer.check(); if(isDev){ modalStack.at(-1)?.close(); } else { await logout(); toast(t('noDeveloperAccess'),'error'); } } break; }
          case 'reply-inquiry': openReplyModal(id); break;
          case 'save-reply': { const fd=new FormData($('#replyForm')); await Developer.replyInquiry(id, fd.get('reply')); modalStack.at(-1)?.close(); break; }
        }
      });

      document.addEventListener('submit', async e => {
        e.preventDefault(); const f=e.target;
        if(f.id==='quickAddForm'){ const fd=new FormData(f); Tasks.create(parseQuickAdd(fd.get('text'))); f.reset(); render(); toast(t('savedMsg'),'success'); }
        if(f.id==='focusForm'){ const fd=new FormData(f); startFocus({taskId:fd.get('taskId')||null,subjectId:fd.get('subjectId')||null,minutes:clamp(Math.round(num(fd.get('minutes'),25)),1,240)}); }
        if(f.id==='emailLoginForm'){ const fd=new FormData(f); await loginWithEmail(fd.get('email'),fd.get('password'),true); }
        if(f.id==='registerForm'){ const fd=new FormData(f); await registerWithEmail(fd.get('name'),fd.get('email'),fd.get('password'),true); }
        if(f.id==='resetForm'){ const fd=new FormData(f); await resetPassword(fd.get('email')); }
        if(f.id==='profileForm'){ const fd=new FormData(f); state.profile.name=String(fd.get('name')||'').trim(); state.profile.school=String(fd.get('school')||'').trim(); state.settings.accent=fd.get('accent'); if(activeProfile){ activeProfile.name=state.profile.name; activeProfile.color=state.settings.accent; const list=getProfiles(); const i=list.findIndex(p=>p.id===activeProfile.id); if(i>=0){list[i]=activeProfile;saveProfiles(list);} } saveState(); applySettings(); render(); toast(t('savedMsg'),'success'); }
        if(f.id==='settingsForm'){ const fd=new FormData(f); state.settings.lang=fd.get('lang'); state.settings.themeMode=fd.get('themeMode'); state.settings.themePreset=fd.get('themePreset'); state.settings.pomodoro.work=clamp(Math.round(num(fd.get('work'),25)),1,240); state.settings.pomodoro.short=clamp(Math.round(num(fd.get('short'),5)),1,120); state.settings.notifyLead=clamp(Math.round(num(fd.get('notifyLead'),60)),1,1440); state.settings.sound=!!fd.get('sound'); state.settings.vibration=!!fd.get('vibration'); saveState(); applySettings(); render(); toast(t('savedMsg'),'success'); }
        if(f.id==='inquiryForm'){ const fd=new FormData(f); await sendInquiry(fd.get('subject'),fd.get('message')); f.reset(); }
        if(f.id==='announceForm'){ if(!state.developer.unlocked)return; const fd=new FormData(f); await Developer.sendAnnouncement(fd.get('title'),fd.get('body')); f.reset(); }
        if(f.id==='flagForm'){ if(!state.developer.unlocked)return; const fd=new FormData(f); const v=fd.get('value'); await Developer.setFlag(fd.get('key'), v==='true'?true:v==='false'?false:v); f.reset(); }
        if(f.id==='grantBadgeForm'){ if(!state.developer.unlocked)return; const fd=new FormData(f); await Developer.grantBadge(fd.get('uid'),fd.get('badgeId')); f.reset(); }
        if(f.id==='grantFrameForm'){ if(!state.developer.unlocked)return; const fd=new FormData(f); await Developer.grantFrame(fd.get('uid'),fd.get('frameId')); f.reset(); }
      });

      document.addEventListener('input', debounce(e=>{
        if(e.target.id==='taskSearch'){ state.ui.taskSearch=e.target.value; const c=$('#tasksContent'); if(c)c.innerHTML=renderTasksContent(); }
      },180));
      document.addEventListener('change', e=>{
        if(e.target.id==='taskSort'){ state.ui.taskSort=e.target.value; saveState(false); $('#tasksContent').innerHTML=renderTasksContent(); }
        if(e.target.matches('[data-action="group-filter"]')){ state.ui.groupFilter=e.target.value; saveState(false); render(); }
        if(e.target.matches('[data-action="team-filter"]')){ state.ui.teamFilter=e.target.value; saveState(false); render(); }
        if(e.target.id==='photoFile'){ handlePhotoFile(e.target.files?.[0]); }
      });
      document.addEventListener('keydown', e=>{
        if(e.key==='Escape' && modalStack.length){ modalStack.at(-1).close(); return; }
        if(e.ctrlKey && e.altKey && e.shiftKey && e.key.toLowerCase()==='d'){ e.preventDefault(); openDeveloperAccessModal(); }
        if(e.target.matches('input,textarea,select')) return;
        if(e.key.toLowerCase()==='n'){ openTaskModal(); }
      });
      document.addEventListener('dragstart', e=>{ const c=e.target.closest('.kanban-card'); if(c)e.dataTransfer.setData('text/plain',c.dataset.id); });
      document.addEventListener('dragover', e=>{ const c=e.target.closest('.kanban-col'); if(c){e.preventDefault();c.classList.add('dragover');} });
      document.addEventListener('dragleave', e=>{ const c=e.target.closest('.kanban-col'); if(c)c.classList.remove('dragover'); });
      document.addEventListener('drop', e=>{ const c=e.target.closest('.kanban-col'); if(!c)return; e.preventDefault(); c.classList.remove('dragover'); const id=e.dataTransfer.getData('text/plain'); const st=c.dataset.status; if(st==='done') Tasks.complete(id); else Tasks.update(id,{status:st}); });
      window.addEventListener('beforeunload', ()=>{ if(activeProfile) saveProfile(activeProfile.id,state); });
      window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ if(state.settings.themeMode==='auto') applySettings(); });

      /* =========================
         16) Init
         ========================= */
      async function registerSW(){ if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ try{ await navigator.serviceWorker.register('sw.js'); }catch{} } }
      async function init(){
        loadLocalPrefs(); bootProfile(); applySettings(); render();
        await initFirebase();
        if(fb.ready){ watchAuth(); if(activeProfile && state.auth.provider==='firebase'){ await Developer.check(); await loadGrants(); await Teams.fetch(); await Challenges.fetchCloud(); await Leaderboard.fetch(state.ui.leaderboardTab||'global'); subscribeLive(); } }
        setInterval(checkNotifications,60000);
        setInterval(()=>{ if(['home','tasks','leaderboard','challenges'].includes(state.ui.view)) render(); },60000);
        registerSW();
      }
      init();
    })();
  </script>
</body>
</html>
